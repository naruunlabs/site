<script src="assets/group-primary.js?v=3.10.2"></script><script>
'use strict';const $=id=>document.getElementById(id);
const PATTERNS={
basic:{name:'기본 4박',notes:[0,1,2,3]},
tail:{name:'끝에 타닥',notes:[0,1,2,3,3.5]},
head:{name:'처음에 타닥',notes:[0,.5,1,2,3]},
middle:{name:'가운데 타닥',notes:[0,1,1.5,2,3]},
pairs:{name:'두 번씩 짝꿍',notes:[0,.5,2,2.5]},
sync:{name:'엇박 리듬',notes:[0,1,1.5,3]},
ends:{name:'처음과 끝 타닥',notes:[0,.5,1,2,3,3.5]},
swing:{name:'반 박씩 이어서',notes:[0,.5,1.5,2.5,3.5]},
ladder:{name:'뒤쪽 빠르게',notes:[0,1,2,2.5,3,3.5]},
fast:{name:'빠른 8번',notes:[0,.5,1,1.5,2,2.5,3,3.5]}
};
const PATTERN_ORDER=Object.keys(PATTERNS);

const ROUTINE_KEY='jmp_echo_routine_v1',SLOTS_KEY='jmp_echo_routine_slots_v1',MAX_ROUTINE=32;
function validRoutine(value){return Array.isArray(value)&&value.length>0&&value.length<=MAX_ROUTINE&&value.every(k=>Object.hasOwn(PATTERNS,k));}
function readSaved(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback;}catch(e){return fallback;}}
function saveLocal(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true;}catch(e){return false;}}
const savedRoutine=readSaved(ROUTINE_KEY,null);let routine=validRoutine(savedRoutine)?savedRoutine.slice():PATTERN_ORDER.slice(),routineDraft=null,routineFocus=null;
function syncRoutineSummary(){$('routineSummary').textContent=routine.length===1?PATTERNS[routine[0]].name:routine.length+'칸 · '+routine.slice(0,2).map(k=>PATTERNS[k].name).join(' → ')+(routine.length>2?' …':'');}
function slotValues(){const a=readSaved(SLOTS_KEY,[]);return Array.from({length:3},(_,i)=>validRoutine(a?.[i])?a[i]:null);}
function editorButton(text,action,label){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=action;if(label)b.setAttribute('aria-label',label);return b;}
function renderEditor(){
 $('routinePatterns').replaceChildren(...PATTERN_ORDER.map(key=>{const b=editorButton(PATTERNS[key].name,()=>{if(routineDraft.length>=MAX_ROUTINE){$('routineMsg').textContent='최대 32칸까지 담을 수 있습니다.';return;}routineDraft.push(key);renderEditor();});b.className='pattern-add';b.dataset.add=key;const mini=document.createElement('span');mini.className='mini-beats';mini.textContent=Array.from({length:4},(_,i)=>{const n=PATTERNS[key].notes.filter(n=>Math.floor(n)===i).length;return n===2?'●●':n?'●':'—';}).join(' │ ');b.append(mini);return b;}));
 $('routineCount').textContent=routineDraft.length+' / 32칸';$('routineApply').disabled=!routineDraft.length;
 $('routineOrder').replaceChildren(...routineDraft.map((key,i)=>{const row=document.createElement('div');row.className='routine-row';const n=document.createElement('span');n.textContent=i+1;const name=document.createElement('strong');name.textContent=PATTERNS[key].name;row.append(n,name);for(const [label,delta]of [['↑',-1],['↓',1]]){const b=editorButton(label,()=>{const j=i+delta;[routineDraft[i],routineDraft[j]]=[routineDraft[j],routineDraft[i]];renderEditor();},(i+1)+'번째 리듬 '+(delta<0?'위로':'아래로'));b.disabled=i+delta<0||i+delta>=routineDraft.length;row.append(b);}row.append(editorButton('×',()=>{routineDraft.splice(i,1);renderEditor();},(i+1)+'번째 리듬 삭제'));return row;}));
 if(!routineDraft.length)$('routineOrder').textContent='왼쪽에서 연습할 리듬을 골라 주세요.';
 const slots=slotValues();$('routineSlots').replaceChildren(...slots.map((saved,i)=>{const box=document.createElement('div');box.className='slot';const label=document.createElement('span');label.textContent='내 루틴 '+(i+1)+(saved?' · '+saved.length+'칸':' · 비어 있음');const save=editorButton('저장',()=>{if(!validRoutine(routineDraft))return;const values=slotValues();values[i]=routineDraft.slice();const ok=saveLocal(SLOTS_KEY,values);renderEditor();$('routineMsg').textContent=ok?'내 루틴 '+(i+1)+'에 저장했습니다.':'기기에 저장할 수 없습니다.';});save.disabled=!routineDraft.length;const load=editorButton('불러오기',()=>{routineDraft=saved.slice();renderEditor();});load.disabled=!saved;box.append(label,save,load);return box;}));
}
function closeEditor(){if(!$('routineModal').open)return;$('routineModal').close();routineDraft=null;routineFocus?.focus();}
$('routineEdit').onclick=()=>{if(state==='running'||state==='paused')return;cancelAudio();routineFocus=document.activeElement;routineDraft=routine.slice();$('routineMsg').textContent='';renderEditor();$('routineModal').showModal();};
$('routineClose').onclick=$('routineCancel').onclick=closeEditor;
$('routineModal').addEventListener('cancel',e=>{e.preventDefault();closeEditor();});
$('routineClear').onclick=()=>{routineDraft=[];renderEditor();};$('routineAll').onclick=()=>{routineDraft=PATTERN_ORDER.slice();renderEditor();};
$('routineApply').onclick=()=>{if(!validRoutine(routineDraft))return;routine=routineDraft.slice();const ok=saveLocal(ROUTINE_KEY,routine);closeEditor();reset();if(!ok)$('lengthNote').textContent+=' 기기 저장 공간을 확인해 주세요. 현재 수업에는 적용됐습니다.';};
let state='idle',elapsed=0,last=0,events=[],roundIndex=-1,currentPhase='',activePattern='',settings={},ac=null,nodes=new Set(),nextAudio=0,audioAnchor=0;
const primary=window.NLGroupPrimary.mount($('start'),window.parent);
function lengthValue(){return [4,8,12,16].includes(+$('length').value)?+$('length').value:4;}
function patternFor(round,chunk=0){return settings.sequence[round][chunk];}
function makeSequence(rounds,chunks){return Array.from({length:rounds},(_,r)=>Array.from({length:chunks},(_,c)=>routine[(r*chunks+c)%routine.length]));}
function makeEvents(){const out=[];for(let r=0;r<settings.rounds;r++)for(let c=0;c<settings.length/4;c++)for(const n of PATTERNS[patternFor(r,c)].notes){const at=r*settings.length*2+c*4+n;out.push({at:at*settings.beat,kind:'listen'},{at:(at+settings.length)*settings.beat,kind:'repeat'});}return out.sort((a,b)=>a.at-b.at);}
function audioOn(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();audioAnchor=ac.currentTime-elapsed/1000;nextAudio=events.findIndex(e=>e.at>=elapsed-5);if(nextAudio<0)nextAudio=events.length;}catch(e){ac=null;}}
function cancelAudio(){for(const o of nodes){try{o.stop();o.disconnect();}catch(e){}}nodes.clear();}
function soundAt(event){if(!ac||!$('sound').checked)return;const when=Math.max(ac.currentTime,audioAnchor+event.at/1000),o=ac.createOscillator(),g=ac.createGain();o.type=event.kind==='tick'?'sine':'triangle';o.frequency.setValueAtTime(event.kind==='tick'?390:event.kind==='listen'?960:640,when);o.frequency.exponentialRampToValueAtTime(event.kind==='tick'?280:180,when+.07);g.gain.setValueAtTime(event.kind==='tick'?.035:.15,when);g.gain.exponentialRampToValueAtTime(.001,when+.11);o.connect(g);g.connect(ac.destination);nodes.add(o);o.onended=()=>nodes.delete(o);o.start(when);o.stop(when+.12);}
function schedule(){if(!ac||ac.state!=='running')return;while(nextAudio<events.length&&events[nextAudio].at<=elapsed+120){const e=events[nextAudio++];if(e.at>=elapsed-80)soundAt(e);}}

function lock(on){for(const id of ['bpm','length','routineEdit','rounds','preview'])$(id).disabled=on;}
function syncControls(){primary.setRunning(state==='running'||state==='paused');$('pause').disabled=state!=='running'&&state!=='paused';$('pause').textContent=state==='paused'?'▶ 계속하기':'Ⅱ 일시정지';lock(state==='running'||state==='paused');}
function drawTrack(key,chunk=0){const track=$('track');track.replaceChildren();for(let i=0;i<4;i++){const b=document.createElement('div');b.className='beat';const number=document.createElement('span');number.className='number';number.textContent=chunk*4+i+1;b.append(number);const notes=PATTERNS[key].notes.filter(n=>Math.floor(n)===i);for(const n of notes){const dot=document.createElement('i');dot.className='dot';dot.dataset.note=n;b.append(dot);}const word=document.createElement('span');word.className='word';word.textContent=notes.length===2?'타닥':notes.length?'탁':'·';b.append(word);track.append(b);}const cursor=document.createElement('div');cursor.className='cursor';cursor.id='cursor';track.append(cursor);}
function progress(chunk,count){$('progress').replaceChildren(...Array.from({length:count},(_,i)=>{const e=document.createElement('span');e.className=i===chunk?'on':i<chunk?'done':'';e.setAttribute('aria-label',(i+1)+'번째 묶음'+(i===chunk?' 진행 중':''));return e;}));}
function reset(){cancelAudio();window.parent.jmpEchoSetRunning(false);state='idle';elapsed=0;last=0;roundIndex=-1;currentPhase='';activePattern='';$('overlay').hidden=true;document.body.dataset.phase='idle';$('stage').classList.remove('turn-change');$('phaseIcon').classList.remove('impact');$('earIcon').toggleAttribute('hidden',false);$('feetIcon').toggleAttribute('hidden',true);$('track').classList.remove('hidden-notes');$('cue').textContent='리듬을 기억해 볼까요?';$('hint').textContent=lengthValue()+'박 듣고 · '+lengthValue()+'박 따라 뛰어요';$('phaseTag').textContent='RHYTHM ECHO';$('roundLabel').textContent='연습 0 / '+$('rounds').value;$('bpmLabel').textContent=$('bpm').value+' BPM';$('patternLabel').textContent='리듬 메아리';$('nextCue').textContent='';$('lengthNote').textContent=lengthValue()+'박을 모두 들은 뒤 같은 순서로 '+lengthValue()+'박을 뜁니다. 담은 순서를 끝까지 사용하면 처음부터 반복하며, 화면은 4박씩 보여줍니다.';progress(0,lengthValue()/4);syncRoutineSummary();drawTrack(routine[0]);$('cursor').hidden=true;syncControls();}
function start(){if(!window.echoAccessAllowed()||state==='running'||state==='paused')return;cancelAudio();settings={bpm:+$('bpm').value,beat:60000/+$('bpm').value,rounds:+$('rounds').value,length:lengthValue()};settings.sequence=makeSequence(settings.rounds,settings.length/4);elapsed=0;last=0;roundIndex=-1;currentPhase='';activePattern='';events=makeEvents();state='running';window.parent.jmpEchoSetRunning(true);$('overlay').hidden=true;syncControls();audioOn();render();schedule();}
function pause(){if(state==='running'){state='paused';window.parent.jmpEchoSetRunning(false);cancelAudio();$('overlay').hidden=false;$('dialogTitle').textContent='일시정지';$('dialogText').textContent='계속하기를 누르면 같은 위치에서 이어집니다.';}else if(state==='paused'){state='running';last=0;window.parent.jmpEchoSetRunning(true);$('overlay').hidden=true;audioOn();schedule();}syncControls();}
function finish(){cancelAudio();window.parent.jmpEchoSetRunning(false);state='ended';syncControls();$('overlay').hidden=false;$('dialogTitle').textContent='리듬 연습 완료!';$('dialogText').textContent=settings.length+'박 듣고 뛰기 · '+settings.rounds+'회 연습을 마쳤습니다.';}
function render(){const span=settings.length*2,globalBeat=elapsed/settings.beat,r=Math.min(settings.rounds-1,Math.floor(globalBeat/span)),local=globalBeat-r*span,phase=local<settings.length?'listen':'repeat',t=local%settings.length,chunk=Math.min(settings.length/4-1,Math.floor(t/4)),bt=t-chunk*4,key=patternFor(r,chunk),view=r+':'+phase+':'+chunk;
if(view!==activePattern){activePattern=view;drawTrack(key,chunk);progress(chunk,settings.length/4);$('patternLabel').textContent=PATTERNS[key].name+' · '+(chunk+1)+' / '+settings.length/4+'묶음';}
roundIndex=r;$('roundLabel').textContent='연습 '+(r+1)+' / '+settings.rounds;
if(phase!==currentPhase){currentPhase=phase;document.body.dataset.phase=phase;$('phaseTag').textContent=phase==='listen'?'LISTEN':'YOUR TURN';$('cue').textContent=phase==='listen'?'들어요':'뛰어요!';$('hint').textContent=phase==='listen'?settings.length+'박을 기억해요 · 지금은 쉬어요':settings.length+'박을 같은 순서로 뛰어요';$('earIcon').toggleAttribute('hidden',phase!=='listen');$('feetIcon').toggleAttribute('hidden',phase!=='repeat');}
const hidden=phase==='repeat'&&!$('guide').checked;$('track').classList.toggle('hidden-notes',hidden);$('cursor').hidden=false;$('cursor').style.left=(bt/4*100)+'%';let hit=false;document.querySelectorAll('.dot').forEach(dot=>{const since=(bt-Number(dot.dataset.note))*settings.beat,on=since>=0&&since<150;dot.classList.toggle('active',on&&!hidden);hit=hit||on;});document.querySelectorAll('.beat').forEach((b,i)=>b.classList.toggle('active',Math.floor(bt)===i&&!hidden));$('phaseIcon').classList.toggle('impact',hit&&(phase==='listen'||!hidden));$('stage').classList.toggle('turn-change',phase==='repeat'&&t*settings.beat<250);$('nextCue').textContent=phase==='listen'&&t>=settings.length-1?'다음은 뛰어요!':'';
}
function update(ms){elapsed=Math.min(elapsed+ms,settings.rounds*settings.length*2*settings.beat);if(elapsed>=settings.rounds*settings.length*2*settings.beat){finish();return;}render();schedule();}
function frame(now){const dt=last?Math.max(0,now-last):0;last=now;if(state==='running')update(dt);requestAnimationFrame(frame);}
$('start').onclick=()=>state==='running'||state==='paused'?reset():start();$('pause').onclick=pause;$('restart').onclick=reset;
$('preview').onclick=()=>{if(state==='running'||state==='paused')return;cancelAudio();const beat=60000/+$('bpm').value,seq=makeSequence(1,lengthValue()/4)[0];try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();audioAnchor=ac.currentTime;seq.forEach((key,c)=>{for(const n of PATTERNS[key].notes)soundAt({at:(c*4+n)*beat,kind:'listen'});});}catch(e){}};
for(const id of ['bpm','length','rounds'])$(id).onchange=()=>{if(state!=='running'&&state!=='paused')reset();};$('guide').onchange=()=>{if(state==='running'||state==='paused')render();};$('sound').onchange=()=>{if(!$('sound').checked)cancelAudio();};$('backGroup').onclick=()=>{reset();window.parent.closeJmpEcho();};
document.addEventListener('keydown',e=>{if($('routineModal').open)return;if(e.code==='Space'&&!/SELECT|INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();state==='running'||state==='paused'?pause():start();}if(e.key==='Escape'){reset();window.parent.closeJmpEcho();}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause();});window.addEventListener('pagehide',()=>{cancelAudio();window.parent.jmpEchoSetRunning(false);});setInterval(()=>{if(!window.echoAccessAllowed()){reset();window.parent.closeJmpEcho();}},1000);if(window.echoAccessAllowed()){reset();requestAnimationFrame(frame);}
</script></body></html>
