<script>
'use strict';const $=id=>document.getElementById(id);
const PATTERNS={

tail:{name:'끝에 타닥',notes:[0,1,2,3,3.5]},
head:{name:'처음에 타닥',notes:[0,.5,1,2,3]},

pairs:{name:'두 번씩 짝꿍',notes:[0,.5,2,2.5]},
sync:{name:'엇박 리듬',notes:[0,1,1.5,3]},
ends:{name:'처음과 끝 타닥',notes:[0,.5,1,2,3,3.5]},

};
const PATTERN_ORDER=Object.keys(PATTERNS);
const PHASES=[{id:'listen',from:0,to:4,title:'먼저 들어요',hint:'듣는 동안 쉬고, 다음 4박에 바로 뛰어요.',tag:'LISTEN'},{id:'repeat',from:4,to:8,title:'같이 뛰어요!',hint:'방금 들은 리듬을 그대로 따라 뛰어요.',tag:'YOUR TURN'}];
let state='idle',elapsed=0,last=0,events=[],roundIndex=-1,currentPhase='',activePattern='basic',settings={},ac=null,nodes=new Set(),nextAudio=0,audioAnchor=0;
function patternFor(round){return settings.sequence?settings.sequence[round]:settings.pattern;}
function makeEvents(){const out=[];for(let r=0;r<settings.rounds;r++){const key=patternFor(r);for(const n of PATTERNS[key].notes){out.push({at:(r*8+n)*settings.beat,kind:'listen'});out.push({at:(r*8+4+n)*settings.beat,kind:'repeat'});}}return out.sort((a,b)=>a.at-b.at);}
function audioOn(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();audioAnchor=ac.currentTime-elapsed/1000;nextAudio=events.findIndex(e=>e.at>=elapsed-5);if(nextAudio<0)nextAudio=events.length;}catch(e){ac=null;}}
function cancelAudio(){for(const o of nodes){try{o.stop();o.disconnect();}catch(e){}}nodes.clear();}
function soundAt(event){if(!ac||!$('sound').checked)return;const when=Math.max(ac.currentTime,audioAnchor+event.at/1000),o=ac.createOscillator(),g=ac.createGain();o.type=event.kind==='tick'?'sine':'triangle';o.frequency.setValueAtTime(event.kind==='tick'?390:event.kind==='listen'?960:640,when);o.frequency.exponentialRampToValueAtTime(event.kind==='tick'?280:180,when+.07);g.gain.setValueAtTime(event.kind==='tick'?.035:.15,when);g.gain.exponentialRampToValueAtTime(.001,when+.11);o.connect(g);g.connect(ac.destination);nodes.add(o);o.onended=()=>nodes.delete(o);o.start(when);o.stop(when+.12);}
function schedule(){if(!ac||ac.state!=='running')return;while(nextAudio<events.length&&events[nextAudio].at<=elapsed+120){const e=events[nextAudio++];if(e.at>=elapsed-80)soundAt(e);}}
function lock(on){for(const id of ['bpm','pattern','rounds'])$(id).disabled=on;}
function drawTrack(key){const pattern=PATTERNS[key],track=$('track');track.replaceChildren();for(let i=0;i<4;i++){const b=document.createElement('div');b.className='beat';const number=document.createElement('span');number.className='number';number.textContent=i+1;b.append(number);const notes=pattern.notes.filter(n=>Math.floor(n)===i);for(const n of notes){const dot=document.createElement('i');dot.className='dot';dot.dataset.note=n;b.append(dot);}const word=document.createElement('span');word.className='word';word.textContent=notes.length===2?'타닥':notes.length?'탁':'·';b.append(word);track.append(b);}const cursor=document.createElement('div');cursor.className='cursor';cursor.id='cursor';track.append(cursor);}
function reset(){cancelAudio();window.parent.jmpEchoSetRunning(false);state='idle';elapsed=0;roundIndex=-1;currentPhase='';$('overlay').hidden=true;$('dialogTitle').textContent='리듬 메아리';$('dialogText').innerHTML='시범 박자를 듣고, 다음 구간에서 같은 리듬을 따라 뜁니다.<br>기본 박자부터 시작해 보세요.';$('overlayStart').textContent='시연 시작 ▶';$('start').textContent='시작 ▶';$('pause').disabled=true;$('pause').textContent='Ⅱ 일시정지';$('roundLabel').textContent='연습 0 / '+$('rounds').value;$('cue').textContent='리듬을 기억해 볼까요?';$('hint').textContent='듣기 → 뛰기';$('phaseTag').textContent='RHYTHM ECHO';$('bpmLabel').textContent=$('bpm').value+' BPM';document.querySelectorAll('[data-phase]').forEach(e=>e.classList.remove('on'));lock(false);drawTrack(['mix','random'].includes($('pattern').value)?'basic':$('pattern').value);}
function start(){if(!window.echoAccessAllowed())return;if(state==='paused'){pause();return;}if(state==='running')return;cancelAudio();settings={bpm:+$('bpm').value,beat:60000/+$('bpm').value,pattern:$('pattern').value,rounds:+$('rounds').value};elapsed=0;roundIndex=-1;currentPhase='';settings.sequence=Array.from({length:settings.rounds},(_,r)=>settings.pattern==='mix'?PATTERN_ORDER[r%PATTERN_ORDER.length]:settings.pattern==='random'?PATTERN_ORDER[Math.floor(Math.random()*PATTERN_ORDER.length)]:settings.pattern);events=makeEvents();state='running';window.parent.jmpEchoSetRunning(true);$('overlay').hidden=true;$('pause').disabled=false;$('start').textContent='진행 중';lock(true);audioOn();render();schedule();}
function pause(){if(state==='running'){state='paused';window.parent.jmpEchoSetRunning(false);cancelAudio();$('pause').textContent='▶ 계속하기';$('start').textContent='계속하기 ▶';$('overlay').hidden=false;$('dialogTitle').textContent='일시정지';$('dialogText').textContent='같은 리듬 위치에서 이어집니다.';$('overlayStart').textContent='계속하기 ▶';}else if(state==='paused'){state='running';window.parent.jmpEchoSetRunning(true);$('pause').textContent='Ⅱ 일시정지';$('start').textContent='진행 중';$('overlay').hidden=true;audioOn();schedule();}}
function finish(){cancelAudio();window.parent.jmpEchoSetRunning(false);state='ended';lock(false);$('pause').disabled=true;$('start').textContent='다시 시작 ▶';$('overlay').hidden=false;$('dialogTitle').textContent='리듬 시연 완료';$('dialogText').textContent=settings.rounds+'개 리듬의 듣기·뛰기를 마쳤습니다. 실제 학생의 성공 여부는 측정하지 않았습니다.';$('overlayStart').textContent='한 번 더 ▶';}
function render(){const globalBeat=elapsed/settings.beat,r=Math.min(settings.rounds-1,Math.floor(globalBeat/8)),local=globalBeat-r*8,phase=PHASES.find(p=>local>=p.from&&local<p.to)||PHASES[1];
if(r!==roundIndex){roundIndex=r;activePattern=patternFor(r);drawTrack(activePattern);$('roundLabel').textContent='연습 '+(r+1)+' / '+settings.rounds;$('patternLabel').textContent=PATTERNS[activePattern].name;}
if(phase.id!==currentPhase){currentPhase=phase.id;$('phaseTag').textContent=phase.tag;$('cue').textContent=phase.title;$('hint').textContent=phase.hint;document.querySelectorAll('[data-phase]').forEach(e=>e.classList.toggle('on',e.dataset.phase===phase.id));}
const active=phase.id==='listen'||phase.id==='repeat',t=local-phase.from,hidden=phase.id==='repeat'&&!$('guide').checked;$('track').classList.toggle('hidden-notes',hidden);$('cursor').style.display=active?'block':'none';$('cursor').style.left=(Math.min(4,t)/4*100)+'%';
let pulse=0;document.querySelectorAll('.dot').forEach(dot=>{const since=(t-Number(dot.dataset.note))*settings.beat,hit=active&&since>=0&&since<150;dot.classList.toggle('active',hit&&!hidden);if(active&&!hidden&&since>=0&&since<300)pulse=Math.max(pulse,Math.sin(Math.min(1,since/300)*Math.PI));});document.querySelectorAll('.beat').forEach((b,i)=>b.classList.toggle('active',active&&Math.floor(t)===i&&!hidden));
}
function update(ms){elapsed=Math.min(elapsed+ms,settings.rounds*8*settings.beat);if(elapsed>=settings.rounds*8*settings.beat){finish();return;}render();schedule();}
function frame(now){const dt=last?Math.min(80,now-last):0;last=now;if(state==='running')update(dt);requestAnimationFrame(frame);}
$('start').onclick=start;$('overlayStart').onclick=start;$('pause').onclick=pause;$('restart').onclick=reset;$('preview').onclick=()=>{if(state==='running')return;cancelAudio();const beat=60000/+$('bpm').value,key=['mix','random'].includes($('pattern').value)?'tail':$('pattern').value;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();audioAnchor=ac.currentTime;for(const n of PATTERNS[key].notes)soundAt({at:n*beat,kind:'listen'});}catch(e){}};
for(const id of ['bpm','pattern','rounds'])$(id).onchange=()=>{if(state!=='running'&&state!=='paused')reset();};$('guide').onchange=()=>{if(state==='running'||state==='paused')render();};$('sound').onchange=()=>{if(!$('sound').checked)cancelAudio();};$('backGroup').onclick=()=>{cancelAudio();window.parent.closeJmpEcho();};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/SELECT|INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();state==='running'||state==='paused'?pause():start();}if(e.key==='Escape'){cancelAudio();window.parent.closeJmpEcho();}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause();});window.addEventListener('pagehide',()=>{cancelAudio();window.parent.jmpEchoSetRunning(false);});setInterval(()=>{if(!window.echoAccessAllowed()){cancelAudio();window.parent.closeJmpEcho();}},1000);if(window.echoAccessAllowed()){reset();requestAnimationFrame(frame);}
</script></body></html>
