<link rel="stylesheet" href="assets/group-primary.css?v=3.10.1"><style>

.phase{position:absolute;left:var(--rail);right:28px;top:13%;height:37%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.phase-icon{width:clamp(64px,11vh,110px);height:clamp(64px,11vh,110px);color:var(--accent);flex-shrink:0}.phase-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.phase h2{font-size:clamp(28px,4vw,56px);letter-spacing:-.04em;margin:4px 0;color:var(--accent)}.phase p{color:#a7c1b3;font-size:14px;margin:2px 0}.phase small{color:var(--accent);letter-spacing:.12em;font-weight:900;font-size:11px}.phase-icon.impact{transform:translateY(-12px)}body[data-phase="listen"] .phase-icon.impact{transform:scale(1.1)}
.progress{display:flex;justify-content:center;gap:10px;position:absolute;left:var(--rail);right:28px;top:53%;height:22px}.progress span{width:12px;height:12px;border:2px solid #698778;border-radius:50%}.progress span.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px #a3e63533}.progress span.done{background:#698778}.track{position:absolute;left:calc(var(--rail) + 16px);right:44px;top:61%;height:clamp(100px,20vh,175px);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.beat{position:relative;border:1px solid #366050;border-radius:14px;background:#09261e;display:flex;align-items:center;justify-content:center;gap:8px}.number{position:absolute;top:10px;left:12px;font-size:14px;color:#8cab9b}.dot{width:clamp(22px,3vw,44px);height:clamp(22px,3vw,44px);border-radius:50%;background:#356555;border:2px solid #5f9e83}.beat.active{background:var(--panel);border-color:var(--accent)}.dot.active{background:var(--accent);border-color:#efffdf;box-shadow:0 0 24px #ffffff33;transform:scale(1.15)}.word{position:absolute;bottom:12px;font-size:15px;font-weight:800;color:#a7c1b3}.cursor{position:absolute;top:-8px;height:calc(100% + 16px);width:3px;background:var(--accent);box-shadow:0 0 12px var(--accent);pointer-events:none}.hidden-notes .dot,.hidden-notes .word{opacity:0}.caption{position:absolute;left:var(--rail);right:28px;bottom:22px;text-align:center;color:#789586;font-size:11px}.next-cue{position:absolute;left:var(--rail);right:28px;top:56%;text-align:center;color:var(--accent);font-size:15px;font-weight:900}
.controls{position:fixed;left:22px;bottom:88px;width:232px;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding-top:10px;border-top:1px solid #9bbca526}.controls button{min-height:36px;border:1px solid #31554c;border-radius:8px;background:#0a2922;color:#b7cdbf;padding:7px 4px;font-weight:800;font-size:12px}.controls #backGroup{grid-column:1/-1;border:0;background:none;color:#94b3a1}.overlay{position:absolute;left:var(--rail);right:28px;top:12%;bottom:90px;display:grid;place-items:center;text-align:center;background:#041714ed;z-index:5;border-radius:16px}.dialog{max-width:480px;padding:20px}.dialog h2{font-size:32px;color:#b9ed80}.dialog p{line-height:1.8;color:#b7cdbf}.dialog small{color:#87a795}.stage.turn-change{box-shadow:inset 0 0 0 5px var(--accent)}
@media(max-width:850px){:root{--rail:250px}aside,.controls{left:16px;width:208px}.track{gap:8px;right:26px}.phase,.top,.progress,.caption,.overlay,.next-cue{right:18px}}

<script src="assets/group-primary.js?v=3.10.1"></script><script>
'use strict';const $=id=>document.getElementById(id);
const PATTERNS={
basic:{name:'기본 4박',notes:[0,1,2,3]},
tail:{name:'끝에 타닥',notes:[0,1,2,3,3.5]},
head:{name:'처음에 타닥',notes:[0,.5,1,2,3]},
middle:{name:'가운데 타닥',notes:[0,1,1.5,2,3]},
pairs:{name:'두 번씩 짝꿍',notes:[0,.5,2,2.5]},
sync:{name:'엇박 리듬',notes:[0,1,1.5,3]},
ends:{name:'처음과 끝 타닥',notes:[0,.5,1,2,3,3.5]},
swing:{name:'반 박씩 이어서',notes:[0,.5,1.5,2.5,3.5]},
ladder:{name:'뒤쪽 빠르게',notes:[0,1,2,2.5,3,3.5]},
fast:{name:'빠른 8번',notes:[0,.5,1,1.5,2,2.5,3,3.5]}
};
const PATTERN_ORDER=Object.keys(PATTERNS);

let state='idle',elapsed=0,last=0,events=[],roundIndex=-1,currentPhase='',activePattern='',settings={},ac=null,nodes=new Set(),nextAudio=0,audioAnchor=0;
const primary=window.NLGroupPrimary.mount($('start'),window.parent);
function lengthValue(){return [4,8,12,16].includes(+$('length').value)?+$('length').value:4;}
function patternFor(round,chunk=0){return settings.sequence[round][chunk];}
function makeSequence(pattern,rounds,chunks){return Array.from({length:rounds},(_,r)=>Array.from({length:chunks},(_,c)=>pattern==='mix'?PATTERN_ORDER[(r*chunks+c)%PATTERN_ORDER.length]:pattern==='random'?PATTERN_ORDER[Math.floor(Math.random()*PATTERN_ORDER.length)]:pattern));}
function makeEvents(){const out=[];for(let r=0;r<settings.rounds;r++)for(let c=0;c<settings.length/4;c++)for(const n of PATTERNS[patternFor(r,c)].notes){const at=r*settings.length*2+c*4+n;out.push({at:at*settings.beat,kind:'listen'},{at:(at+settings.length)*settings.beat,kind:'repeat'});}return out.sort((a,b)=>a.at-b.at);}
function audioOn(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();audioAnchor=ac.currentTime-elapsed/1000;nextAudio=events.findIndex(e=>e.at>=elapsed-5);if(nextAudio<0)nextAudio=events.length;}catch(e){ac=null;}}
function cancelAudio(){for(const o of nodes){try{o.stop();o.disconnect();}catch(e){}}nodes.clear();}
function soundAt(event){if(!ac||!$('sound').checked)return;const when=Math.max(ac.currentTime,audioAnchor+event.at/1000),o=ac.createOscillator(),g=ac.createGain();o.type=event.kind==='tick'?'sine':'triangle';o.frequency.setValueAtTime(event.kind==='tick'?390:event.kind==='listen'?960:640,when);o.frequency.exponentialRampToValueAtTime(event.kind==='tick'?280:180,when+.07);g.gain.setValueAtTime(event.kind==='tick'?.035:.15,when);g.gain.exponentialRampToValueAtTime(.001,when+.11);o.connect(g);g.connect(ac.destination);nodes.add(o);o.onended=()=>nodes.delete(o);o.start(when);o.stop(when+.12);}
function schedule(){if(!ac||ac.state!=='running')return;while(nextAudio<events.length&&events[nextAudio].at<=elapsed+120){const e=events[nextAudio++];if(e.at>=elapsed-80)soundAt(e);}}

function lock(on){for(const id of ['bpm','length','pattern','rounds','preview'])$(id).disabled=on;}
function syncControls(){primary.setRunning(state==='running'||state==='paused');$('pause').disabled=state!=='running'&&state!=='paused';$('pause').textContent=state==='paused'?'▶ 계속하기':'Ⅱ 일시정지';lock(state==='running'||state==='paused');}
function drawTrack(key,chunk=0){const track=$('track');track.replaceChildren();for(let i=0;i<4;i++){const b=document.createElement('div');b.className='beat';const number=document.createElement('span');number.className='number';number.textContent=chunk*4+i+1;b.append(number);const notes=PATTERNS[key].notes.filter(n=>Math.floor(n)===i);for(const n of notes){const dot=document.createElement('i');dot.className='dot';dot.dataset.note=n;b.append(dot);}const word=document.createElement('span');word.className='word';word.textContent=notes.length===2?'타닥':notes.length?'탁':'·';b.append(word);track.append(b);}const cursor=document.createElement('div');cursor.className='cursor';cursor.id='cursor';track.append(cursor);}
function progress(chunk,count){$('progress').replaceChildren(...Array.from({length:count},(_,i)=>{const e=document.createElement('span');e.className=i===chunk?'on':i<chunk?'done':'';e.setAttribute('aria-label',(i+1)+'번째 묶음'+(i===chunk?' 진행 중':''));return e;}));}
function reset(){cancelAudio();window.parent.jmpEchoSetRunning(false);state='idle';elapsed=0;last=0;roundIndex=-1;currentPhase='';activePattern='';$('overlay').hidden=true;document.body.dataset.phase='idle';$('stage').classList.remove('turn-change');$('phaseIcon').classList.remove('impact');$('earIcon').toggleAttribute('hidden',false);$('feetIcon').toggleAttribute('hidden',true);$('track').classList.remove('hidden-notes');$('cue').textContent='리듬을 기억해 볼까요?';$('hint').textContent=lengthValue()+'박 듣고 · '+lengthValue()+'박 따라 뛰어요';$('phaseTag').textContent='RHYTHM ECHO';$('roundLabel').textContent='연습 0 / '+$('rounds').value;$('bpmLabel').textContent=$('bpm').value+' BPM';$('patternLabel').textContent='리듬 메아리';$('nextCue').textContent='';$('lengthNote').textContent=lengthValue()+'박을 모두 들은 뒤 같은 순서로 '+lengthValue()+'박을 뜁니다. 긴 리듬은 4박씩 나눠 보여줍니다.';progress(0,lengthValue()/4);drawTrack(['mix','random'].includes($('pattern').value)?'basic':$('pattern').value);$('cursor').hidden=true;syncControls();}
function start(){if(!window.echoAccessAllowed()||state==='running'||state==='paused')return;cancelAudio();settings={bpm:+$('bpm').value,beat:60000/+$('bpm').value,pattern:$('pattern').value,rounds:+$('rounds').value,length:lengthValue()};settings.sequence=makeSequence(settings.pattern,settings.rounds,settings.length/4);elapsed=0;last=0;roundIndex=-1;currentPhase='';activePattern='';events=makeEvents();state='running';window.parent.jmpEchoSetRunning(true);$('overlay').hidden=true;syncControls();audioOn();render();schedule();}
function pause(){if(state==='running'){state='paused';window.parent.jmpEchoSetRunning(false);cancelAudio();$('overlay').hidden=false;$('dialogTitle').textContent='일시정지';$('dialogText').textContent='계속하기를 누르면 같은 위치에서 이어집니다.';}else if(state==='paused'){state='running';last=0;window.parent.jmpEchoSetRunning(true);$('overlay').hidden=true;audioOn();schedule();}syncControls();}
function finish(){cancelAudio();window.parent.jmpEchoSetRunning(false);state='ended';syncControls();$('overlay').hidden=false;$('dialogTitle').textContent='리듬 연습 완료!';$('dialogText').textContent=settings.length+'박 듣고 뛰기 · '+settings.rounds+'회 연습을 마쳤습니다.';}
function render(){const span=settings.length*2,globalBeat=elapsed/settings.beat,r=Math.min(settings.rounds-1,Math.floor(globalBeat/span)),local=globalBeat-r*span,phase=local<settings.length?'listen':'repeat',t=local%settings.length,chunk=Math.min(settings.length/4-1,Math.floor(t/4)),bt=t-chunk*4,key=patternFor(r,chunk),view=r+':'+phase+':'+chunk;
if(view!==activePattern){activePattern=view;drawTrack(key,chunk);progress(chunk,settings.length/4);$('patternLabel').textContent=PATTERNS[key].name+' · '+(chunk+1)+' / '+settings.length/4+'묶음';}
roundIndex=r;$('roundLabel').textContent='연습 '+(r+1)+' / '+settings.rounds;
if(phase!==currentPhase){currentPhase=phase;document.body.dataset.phase=phase;$('phaseTag').textContent=phase==='listen'?'LISTEN':'YOUR TURN';$('cue').textContent=phase==='listen'?'들어요':'뛰어요!';$('hint').textContent=phase==='listen'?settings.length+'박을 기억해요 · 지금은 쉬어요':settings.length+'박을 같은 순서로 뛰어요';$('earIcon').toggleAttribute('hidden',phase!=='listen');$('feetIcon').toggleAttribute('hidden',phase!=='repeat');}
const hidden=phase==='repeat'&&!$('guide').checked;$('track').classList.toggle('hidden-notes',hidden);$('cursor').hidden=false;$('cursor').style.left=(bt/4*100)+'%';let hit=false;document.querySelectorAll('.dot').forEach(dot=>{const since=(bt-Number(dot.dataset.note))*settings.beat,on=since>=0&&since<150;dot.classList.toggle('active',on&&!hidden);hit=hit||on;});document.querySelectorAll('.beat').forEach((b,i)=>b.classList.toggle('active',Math.floor(bt)===i&&!hidden));$('phaseIcon').classList.toggle('impact',hit&&(phase==='listen'||!hidden));$('stage').classList.toggle('turn-change',phase==='repeat'&&t*settings.beat<250);$('nextCue').textContent=phase==='listen'&&t>=settings.length-1?'다음은 뛰어요!':'';
}
function update(ms){elapsed=Math.min(elapsed+ms,settings.rounds*settings.length*2*settings.beat);if(elapsed>=settings.rounds*settings.length*2*settings.beat){finish();return;}render();schedule();}
function frame(now){const dt=last?Math.max(0,now-last):0;last=now;if(state==='running')update(dt);requestAnimationFrame(frame);}
$('start').onclick=()=>state==='running'||state==='paused'?reset():start();$('pause').onclick=pause;$('restart').onclick=reset;
$('preview').onclick=()=>{if(state==='running'||state==='paused')return;cancelAudio();const beat=60000/+$('bpm').value,seq=makeSequence($('pattern').value,1,lengthValue()/4)[0];try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();audioAnchor=ac.currentTime;seq.forEach((key,c)=>{for(const n of PATTERNS[key].notes)soundAt({at:(c*4+n)*beat,kind:'listen'});});}catch(e){}};
for(const id of ['bpm','length','pattern','rounds'])$(id).onchange=()=>{if(state!=='running'&&state!=='paused')reset();};$('guide').onchange=()=>{if(state==='running'||state==='paused')render();};$('sound').onchange=()=>{if(!$('sound').checked)cancelAudio();};$('backGroup').onclick=()=>{reset();window.parent.closeJmpEcho();};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/SELECT|INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();state==='running'||state==='paused'?pause():start();}if(e.key==='Escape'){reset();window.parent.closeJmpEcho();}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause();});window.addEventListener('pagehide',()=>{cancelAudio();window.parent.jmpEchoSetRunning(false);});setInterval(()=>{if(!window.echoAccessAllowed()){reset();window.parent.closeJmpEcho();}},1000);if(window.echoAccessAllowed()){reset();requestAnimationFrame(frame);}
</script></body></html>
