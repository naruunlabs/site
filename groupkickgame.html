<script id="kick-game-engine">
'use strict';
const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d'),HOST=window.parent;
const PAIR_GAP=600,RIGHT='#ff4b67',LEFT='#45a4ff';
let state='idle',elapsed=0,last=0,done=0,total=40,targets=[],nextSpawn=0,options={},audio=null,wake=null,epoch=0;
let musicPlayer=null,noiseBuffer=null;
let identityObserver=null;
function syncHostIdentity(){
  try{
    for(const [source,target] of [['#panelDojangName','identityDojang'],['#panelAuth','identityAuth'],['#panelVersion','identityVersion'],['.akm-powered','identityPowered']]){
      const from=HOST.document.querySelector(source),to=$(target);if(!from||!to)continue;
      const text=from.textContent.trim();to.textContent=text;to.hidden=!text;
      const style=HOST.getComputedStyle(from);
      for(const prop of ['font-family','font-size','font-weight','font-style','color','line-height','letter-spacing','text-shadow','text-transform'])to.style.setProperty(prop,style.getPropertyValue(prop));
    }
    document.documentElement.style.setProperty('--identity-bottom',Math.max(130,$('identity').getBoundingClientRect().bottom+24)+'px');
  }catch(e){}
}
function allowed(){return window.kickGameAccessAllowed();}
function hostRunning(on){$('quickStart').hidden=state!=='idle';try{HOST.setGroupRunning(on);}catch(e){}}
function tone(){if(!$('sound').checked)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const now=audio.currentTime;
if(!noiseBuffer){noiseBuffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.13),audio.sampleRate);const data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3);}
const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),crack=audio.createGain();src.buffer=noiseBuffer;filter.type='bandpass';filter.frequency.value=1700;filter.Q.value=.8;crack.gain.value=.55;src.connect(filter);filter.connect(crack);crack.connect(audio.destination);src.start(now);
const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(210,now);o.frequency.exponentialRampToValueAtTime(60,now+.14);g.gain.setValueAtTime(.24,now);g.gain.exponentialRampToValueAtTime(.001,now+.17);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.18);
}catch(e){$('audioStatus').textContent='기기 소리 설정을 확인해 주세요.';}}
function stopMusic(){if(musicPlayer){musicPlayer.pause();try{musicPlayer.currentTime=0;}catch(e){}}}
function playMusic(resume=false){const file=$('music').value;if(file==='off'){stopMusic();$('audioStatus').textContent='배경음악 꺼짐';return;}
try{if(!musicPlayer){musicPlayer=new Audio();musicPlayer.loop=true;musicPlayer.preload='none';}const url=new URL('bgm/'+file,location.href).href;if(musicPlayer.src!==url){musicPlayer.src=url;resume=false;}if(!resume)musicPlayer.currentTime=0;musicPlayer.volume=+$('musicVolume').value/100;
const playing=musicPlayer.play();if(playing&&playing.catch)playing.catch(()=>{$('audioStatus').textContent='음악 재생을 못 했습니다. 음악을 바꾸거나 다시 시작해 주세요.';});$('audioStatus').textContent='배경음악 재생 중';
}catch(e){$('audioStatus').textContent='음악 재생을 못 했습니다. 타격음은 계속 사용할 수 있습니다.';}}
function cue(text,color=''){$('cue').textContent=text;$('cue').style.color=color;}
function lock(on){for(const id of ['skill','speed','pattern','count'])$(id).disabled=on;}
async function wakeOn(){const ticket=epoch;try{if(navigator.wakeLock){const w=await navigator.wakeLock.request('screen');if(ticket!==epoch||state!=='running')w.release().catch(()=>{});else wake=w;}}catch(e){}}
function wakeOff(){epoch++;try{if(wake)wake.release().catch(()=>{});}catch(e){}wake=null;}
function reset(){stopMusic();state='idle';elapsed=0;done=0;targets=[];total=+$('count').value;document.body.classList.remove('running');$('results').hidden=true;$('pause').disabled=true;$('pause').textContent='Ⅱ 일시정지';$('progress').textContent='진행 0 / '+total;$('patternBadge').textContent='연속 간격 0.6초';cue('준비되셨나요?');lock(false);hostRunning(false);wakeOff();}
function start(){if(!allowed())return;reset();options={skill:$('skill').value,travel:+$('speed').value,pattern:$('pattern').value};total=+$('count').value;state='running';document.body.classList.add('running');lock(true);$('pause').disabled=false;nextSpawn=3000;hostRunning(true);tone();playMusic();wakeOn();}
function pause(){if(state==='running'){state='paused';if(musicPlayer)musicPlayer.pause();$('pause').textContent='▶ 계속하기';cue('일시정지');hostRunning(false);wakeOff();}else if(state==='paused'&&allowed()){state='running';$('pause').textContent='Ⅱ 일시정지';hostRunning(true);showUpcoming();playMusic(true);wakeOn();}}
function makeTarget(index,at,round){return {name:(index%2?'왼발':'오른발')+' '+(round?'돌려차기':'앞차기'),round,right:index%2===0,color:index%2?LEFT:RIGHT,at,travel:options.travel,hit:false,fx:[]};}
function spawn(){const size=options.pattern==='single'?1:options.pattern==='double'?2:(Math.random()<.5?1:2),n=Math.min(size,total-done),round=options.skill==='round'||(options.skill==='mixed'&&Math.random()<.5);targets=[];
for(let i=0;i<n;i++)targets.push(makeTarget(done+i,elapsed+options.travel+i*PAIR_GAP,round));
$('patternBadge').textContent=n===2?'2연속 · 0.6초':'단발';showUpcoming();}
function showUpcoming(){const upcoming=targets.filter(t=>!t.hit);cue(upcoming.map(t=>t.name).join(' → '),upcoming.length===1?upcoming[0].color:'');}
function impact(t){t.hit=true;done++;tone();t.fx=Array.from({length:28},()=>({x:0,y:0,vx:(Math.random()-.5)*860,vy:(Math.random()-.5)*540,r:2+Math.random()*4}));$('progress').textContent='진행 '+done+' / '+total;showUpcoming();}
function finish(){state='ended';stopMusic();wakeOff();hostRunning(false);$('pause').disabled=true;$('results').hidden=false;$('summary').textContent='표적 '+total+'개의 화면 진행을 마쳤습니다. 실제 발차기 성공 여부는 측정하지 않았습니다.';}
function update(dt){elapsed+=dt;if(elapsed<3000){cue(String(Math.max(1,Math.ceil((3000-elapsed)/1000))));return;}if(!targets.length&&elapsed>=nextSpawn)spawn();
for(const t of targets){if(!t.hit&&elapsed>=t.at)impact(t);if(t.hit)for(const f of t.fx){f.x+=f.vx*dt/1000;f.y+=f.vy*dt/1000;f.vy+=dt*.35;}}
if(targets.length&&targets.every(t=>t.hit)&&elapsed>=targets[targets.length-1].at+500){if(done>=total)finish();else spawn();}}
function geometry(t,w,h){const base=Math.min(w*.40,h*.68)*.60;return {width:t.round?base*.18:base*1.2,height:t.round?base*1.05:base*.18,angle:t.round?(t.right?1:-1)*20*Math.PI/180:0};}
function grid(w,h){const g=ctx.createRadialGradient(w*.5,h*.38,0,w*.5,h*.38,Math.max(w,h));g.addColorStop(0,'#242a36');g.addColorStop(.4,'#11151d');g.addColorStop(1,'#050609');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const vx=w/2,vy=h*.4;ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(vx,vy);ctx.lineTo(vx+i*w*.2,h);ctx.stroke();}for(let i=0;i<12;i++){const y=vy+(i/12)**2*(h-vy);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}}
function draw(){const box=cv.getBoundingClientRect(),fullWidth=box.width,h=box.height,dpr=Math.min(devicePixelRatio||1,2),rail=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail'))||282,w=Math.max(100,fullWidth-rail);if(cv.width!==Math.round(fullWidth*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(fullWidth*dpr);cv.height=Math.round(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#080b11';ctx.fillRect(0,0,fullWidth,h);ctx.save();ctx.translate(rail,0);ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();grid(w,h);
const active=targets.find(t=>!t.hit)||targets[targets.length-1];if(active){const g=geometry(active,w,h);ctx.save();ctx.translate(w/2,h*.57);ctx.rotate(g.angle);ctx.strokeStyle=active.color;ctx.globalAlpha=.65;ctx.lineWidth=1;ctx.strokeRect(-g.width/2,-g.height/2,g.width,g.height);ctx.restore();}
for(const t of [...targets].reverse()){if(t.hit||elapsed<t.at-t.travel)continue;const p=Math.max(0,Math.min(1,1-(t.at-elapsed)/t.travel)),s=.12+.88*p*p,g=geometry(t,w,h);ctx.save();ctx.translate(w/2,h*(.41+p*p*.16));ctx.rotate(g.angle);ctx.fillStyle=t.color;ctx.fillRect(-g.width*s/2,-g.height*s/2,g.width*s,g.height*s);ctx.restore();}
for(const t of targets){if(!t.hit)continue;const opacity=Math.max(0,1-(elapsed-t.at)/320);ctx.save();ctx.globalAlpha=opacity;ctx.fillStyle=t.color;for(const f of t.fx)ctx.fillRect(w/2+f.x,h*.57+f.y,f.r*2,f.r);ctx.restore();}ctx.restore();}
function frame(now){const dt=last?Math.min(80,now-last):0;last=now;if(state==='running')update(dt);draw();requestAnimationFrame(frame);}
$('quickStart').onclick=start;$('again').onclick=start;$('pause').onclick=pause;$('reset').onclick=reset;$('configure').onclick=reset;
$('fullscreen').onclick=()=>{if(typeof HOST.toggleHostFullscreen==='function')HOST.toggleHostFullscreen();};
