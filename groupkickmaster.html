<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AI KICK MASTER · 단체 콤비네이션 테스트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{--red:#E3172E;--orange:#FF6A1A;--deep:#090B10;--panel:rgba(14,16,22,.86);--line:rgba(255,255,255,.13);--muted:#98A2B3;--lime:#FFD166;--blue:#56B4FF}
*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;overflow:hidden;background:#050609;color:#fff;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}button,select{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{height:100%;display:grid;grid-template-columns:330px 1fr;background:radial-gradient(circle at 68% 30%,#252934 0,#11141b 35%,#07080c 76%)}
.side{position:relative;z-index:5;padding:24px 20px 18px;background:linear-gradient(90deg,rgba(5,6,9,.97),rgba(5,6,9,.84));border-right:1px solid var(--line);overflow:auto}.brand{font-size:12px;font-weight:900;letter-spacing:.15em;color:#fff}.brand em{color:var(--red);font-style:normal}.version{margin-top:6px;color:#667085;font-size:10px}.test{display:inline-flex;margin-top:17px;padding:6px 9px;border:1px solid rgba(227,23,46,.4);color:#FF8A96;font-size:10px;font-weight:900;letter-spacing:.12em}.side h1{margin-top:22px;font-size:27px;line-height:1.08;letter-spacing:-.05em}.side h1 span{color:#FF5265}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:22px}.tabs button,.field select{width:100%;background:rgba(255,255,255,.07);border:1px solid transparent}.tabs button{padding:11px 5px;font-size:13px;font-weight:900}.tabs button.on{background:rgba(227,23,46,.22);border-color:var(--red)}.field{display:block;margin-top:14px}.field span{display:block;margin-bottom:6px;color:#98A2B3;font-size:11px;font-weight:800}.field select{height:40px;padding:0 10px;color:#fff;outline:none}.field option{background:#161922}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:18px}.actions button{min-height:43px;background:rgba(255,255,255,.08);font-weight:900}.actions .start{grid-column:1/-1;background:linear-gradient(135deg,var(--red),#B91426);font-size:18px}.actions button:disabled{opacity:.35;cursor:default}.tip{margin-top:14px;color:#667085;font-size:10px;line-height:1.6}
.stage{position:relative;min-width:0;overflow:hidden}.top{position:absolute;z-index:4;top:22px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:flex-start}.routine-name{font-size:12px;font-weight:900;letter-spacing:.14em;color:#C7CDD7}.set{font-size:13px;font-weight:900;color:#fff}.progress{position:absolute;z-index:4;top:56px;left:34px;right:34px;height:4px;background:rgba(255,255,255,.1);overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--red),var(--orange));transition:width .25s}
.cue{position:absolute;z-index:4;top:88px;left:50%;transform:translateX(-50%);width:min(720px,72%);text-align:center}.cue .beat{font-size:12px;font-weight:900;letter-spacing:.22em;color:#FF8994}.cue h2{margin-top:8px;font-size:clamp(35px,5vw,72px);line-height:1;letter-spacing:-.055em;text-shadow:0 5px 20px rgba(0,0,0,.7)}.cue h2 .side-word{color:#FF5265}.cue p{margin-top:10px;color:#B6BFCC;font-size:clamp(13px,1.3vw,18px);font-weight:700}.next{position:absolute;z-index:4;right:34px;bottom:28px;padding:13px 16px;border-left:3px solid var(--orange);background:rgba(5,6,9,.68);font-size:12px;color:#AAB4C2}.next b{display:block;margin-top:4px;color:#fff;font-size:17px}
.floor{position:absolute;left:0;right:0;bottom:0;height:53%;background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(255,255,255,.055));clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}.floor:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 99px,rgba(255,255,255,.025) 100px),repeating-linear-gradient(0deg,transparent 0 70px,rgba(255,255,255,.025) 71px);transform:perspective(480px) rotateX(54deg);transform-origin:center bottom}
.arena{position:absolute;left:50%;bottom:5%;width:min(720px,70vw);height:min(520px,68vh);transform:translateX(-50%)}.figure{position:absolute;left:50%;top:42%;width:170px;height:300px;transform:translate(-50%,-50%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}.head{position:absolute;left:67px;top:0;width:38px;height:44px;border:7px solid #ECEFF4;border-radius:50%}.torso{position:absolute;left:50px;top:48px;width:72px;height:98px;background:linear-gradient(135deg,#F7F8FA,#AEB7C4);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.belt{position:absolute;left:45px;top:139px;width:82px;height:12px;background:var(--red)}.limb{position:absolute;height:15px;background:#D8DEE7;border-radius:20px;transform-origin:8px 8px;transition:transform .3s cubic-bezier(.2,.8,.2,1),width .3s,left .3s,top .3s}.arm-l{left:52px;top:62px;width:76px;transform:rotate(118deg)}.arm-r{left:110px;top:62px;width:76px;transform:rotate(62deg)}.leg-l{left:66px;top:148px;width:115px;transform:rotate(104deg)}.leg-r{left:92px;top:148px;width:115px;transform:rotate(76deg)}.figure.left-kick .leg-l{transform:rotate(177deg);width:150px}.figure.right-kick .leg-r{transform:rotate(3deg);width:150px}.figure.left-kick{transform:translate(-50%,-50%) rotate(-3deg)}.figure.right-kick{transform:translate(-50%,-50%) rotate(3deg)}.figure.guard .arm-l{transform:rotate(72deg)}.figure.guard .arm-r{transform:rotate(108deg)}
.pads{position:absolute;left:50%;bottom:0;width:460px;height:180px;transform:translateX(-50%);perspective:700px}.pad{position:absolute;bottom:35px;width:72px;height:145px;border:3px solid rgba(255,255,255,.25);border-radius:48% 48% 35% 35%;background:rgba(255,255,255,.055);transform:rotateX(57deg);transition:.32s cubic-bezier(.2,.8,.2,1)}.pad:after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotateX(-57deg);font-size:12px;font-weight:900}.pad.left{left:132px;color:var(--blue)}.pad.right{right:132px;color:#FF6677}.pad.active{border-color:currentColor;background:color-mix(in srgb,currentColor 25%,transparent);box-shadow:0 0 34px currentColor}.pad.target{bottom:90px;opacity:.32;border-style:dashed}.pad.kick{bottom:110px;transform:rotateX(57deg) translateY(-60px);box-shadow:0 0 45px currentColor}.arrow{position:absolute;left:50%;bottom:145px;width:180px;height:5px;background:linear-gradient(90deg,var(--orange),transparent);transform-origin:left center;opacity:0;transition:.25s}.arrow:after{content:"";position:absolute;right:0;top:-7px;border-left:15px solid var(--orange);border-top:9px solid transparent;border-bottom:9px solid transparent}.arrow.show{opacity:1}.arrow.left{transform:rotate(180deg)}.arrow.right{transform:rotate(0)}
.countdown,.rest{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:rgba(3,4,7,.76);backdrop-filter:blur(5px)}.countdown[hidden],.rest[hidden]{display:none}.countdown b,.rest b{font-size:min(20vw,180px);line-height:1}.rest div{text-align:center}.rest span{display:block;color:#B8C1CE;font-weight:900}.rest b{display:block;margin-top:10px;color:var(--lime)}
@media(max-width:800px){.app{grid-template-columns:260px 1fr}.side{padding:17px 14px}.side h1{font-size:22px}.cue{top:74px}.top{left:20px;right:20px}.progress{left:20px;right:20px}.arena{transform:translateX(-50%) scale(.8)}}
</style>
</head>
<body>
<main class="app" id="app">
  <aside class="side">
    <div class="brand">AI <em>KICK</em> MASTER</div><div class="version">GROUP COMBINATION · TEST v0.1</div><span class="test">TEST BUILD</span>
    <h1>단체 <span>콤비네이션</span></h1>
    <div class="tabs"><button class="on" data-kind="practice">연습</button><button data-kind="live">실전</button></div>
    <label class="field"><span>루틴</span><select id="routine"></select></label>
    <div class="grid"><label class="field"><span>속도</span><select id="bpm"><option value="60">느리게 · 60</option><option value="80" selected>기본 · 80</option><option value="100">빠르게 · 100</option><option value="120">매우 빠르게 · 120</option></select></label><label class="field"><span>세트</span><select id="sets"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label></div>
    <label class="field"><span>세트 휴식</span><select id="rest"><option value="10">10초</option><option value="15" selected>15초</option><option value="20">20초</option><option value="30">30초</option></select></label>
    <div class="actions"><button id="prev">이전</button><button id="next">다음</button><button class="start" id="start">시작</button><button id="pause" disabled>일시정지</button><button id="reset">처음으로</button></div>
    <div class="tip">카메라를 사용하지 않는 단체 수업 지휘 테스트입니다.</div>
  </aside>
  <section class="stage" id="stage">
    <div class="top"><div class="routine-name" id="routineName"></div><div class="set" id="setText">연습 · 1세트</div></div><div class="progress"><i id="progress"></i></div>
    <div class="cue"><div class="beat" id="beat">READY</div><h2 id="cue">준비 자세</h2><p id="detail">양발을 모으고 정면을 봅니다</p></div>
    <div class="floor"></div><div class="arena"><div class="figure guard" id="figure"><i class="head"></i><i class="torso"></i><i class="belt"></i><i class="limb arm-l"></i><i class="limb arm-r"></i><i class="limb leg-l"></i><i class="limb leg-r"></i></div><div class="pads"><i class="pad left" data-label="왼발"></i><i class="pad right" data-label="오른발"></i><i class="arrow" id="arrow"></i></div></div>
    <div class="next">다음 동작<b id="nextCue">오른발 앞차기</b></div>
    <div class="countdown" id="countdown" hidden><b id="countNum">3</b></div><div class="rest" id="restScreen" hidden><div><span>다음 세트 준비</span><b id="restNum">15</b></div></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const routines=[
 {name:'기초 앞차기',steps:[['준비 자세','center','양발을 모으고 정면을 봅니다'],['오른발 앞차기','right','무릎을 들고 정면으로 찹니다'],['제자리 내려놓기','center','오른발을 원래 자리에 놓습니다'],['왼발 앞차기','left','무릎을 들고 정면으로 찹니다'],['제자리 내려놓기','center','왼발을 원래 자리에 놓습니다']]},
 {name:'좌우 돌려차기',steps:[['겨루기 준비','center','양손을 올리고 중심을 잡습니다'],['오른발 돌려차기','right','축발을 돌리고 몸통 높이로 찹니다'],['앞에 내려놓기','step-right','오른발을 앞쪽 발판에 놓습니다'],['왼발 돌려차기','left','축발을 돌리고 몸통 높이로 찹니다'],['준비 자세','center','간격을 다시 맞춥니다']]},
 {name:'앞차기 · 돌려차기',steps:[['겨루기 준비','center','양손을 올리고 시작합니다'],['오른발 앞차기','right','정면으로 빠르게 찹니다'],['오른발 돌려차기','right','내리지 않고 이어서 돌려찹니다'],['뒤로 이동','back','안전 간격을 다시 확보합니다'],['왼발 앞차기','left','정면으로 빠르게 찹니다'],['왼발 돌려차기','left','내리지 않고 이어서 돌려찹니다'],['준비 자세','center','호흡을 정리합니다']]},
 {name:'발차기 체력',steps:[['준비 자세','center','가볍게 제자리에서 준비합니다'],['오른발 앞차기','right','빠르고 짧게 찹니다'],['왼발 앞차기','left','빠르고 짧게 찹니다'],['오른발 돌려차기','right','몸통 높이로 찹니다'],['왼발 돌려차기','left','몸통 높이로 찹니다'],['좌우 스텝','step','두 번 가볍게 이동합니다'],['준비 자세','center','다음 반복을 준비합니다']]}
];
let kind='practice',ri=0,si=0,setNo=1,running=false,paused=false,timer=0,audio=null;
function init(){ $('routine').innerHTML=routines.map((r,i)=>`<option value="${i}">${r.name}</option>`).join(''); render(); }
function step(){return routines[ri].steps[si]}
function render(){const s=step(),next=routines[ri].steps[(si+1)%routines[ri].steps.length];$('routineName').textContent=routines[ri].name.toUpperCase();$('setText').textContent=`${kind==='practice'?'연습':'실전'} · ${setNo}세트`;$('beat').textContent=`${si+1} / ${routines[ri].steps.length}`;$('cue').innerHTML=s[0].replace(/^(오른발|왼발)/,'<span class="side-word">$1</span>');$('detail').textContent=s[2];$('nextCue').textContent=next[0];$('progress').style.width=((si+1)/routines[ri].steps.length*100)+'%';pose(s[1]);}
function pose(type){const f=$('figure'),pads=[...document.querySelectorAll('.pad')],a=$('arrow');f.className='figure guard';pads.forEach(p=>p.className='pad '+(p.classList.contains('left')?'left':'right'));a.className='arrow';if(type==='left'||type==='right'){f.classList.add(type+'-kick');document.querySelector('.pad.'+type).classList.add('active','kick');document.querySelector('.pad.'+(type==='left'?'right':'left')).classList.add('active');a.className='arrow show '+type;}else if(type==='step-right'){document.querySelector('.pad.right').classList.add('active','target');}else pads.forEach(p=>p.classList.add('active'));}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1.15;speechSynthesis.speak(u)}catch(e){}}
function beep(freq=620){try{audio=audio||new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.07;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);o.stop(audio.currentTime+.11)}catch(e){}}
function move(d){si=(si+d+routines[ri].steps.length)%routines[ri].steps.length;render();speak(step()[0]);}
function schedule(){clearTimeout(timer);if(!running||paused)return;const ms=60000/(+$('bpm').value)*(kind==='practice'?2:1);timer=setTimeout(async()=>{if(si<routines[ri].steps.length-1){si++;render();beep();speak(step()[0]);schedule();}else await endSet();},ms)}
async function endSet(){if(setNo<+$('sets').value){running=false;const sec=+$('rest').value;$('restScreen').hidden=false;for(let n=sec;n>0;n--){$('restNum').textContent=n;await new Promise(r=>setTimeout(r,1000));}setNo++;si=0;$('restScreen').hidden=true;running=true;render();speak(`${setNo}세트 시작`);schedule();}else{running=false;$('start').textContent='다시 시작';$('pause').disabled=true;$('beat').textContent='FINISH';speak('운동 끝');}}
async function start(){if(running)return;setNo=1;si=0;$('countdown').hidden=false;for(const n of ['3','2','1','시작']){$('countNum').textContent=n;beep(n==='시작'?900:560);await new Promise(r=>setTimeout(r,700));}$('countdown').hidden=true;running=true;paused=false;$('start').textContent='진행 중';$('pause').disabled=false;render();speak(step()[0]);schedule();}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('routine').onchange=e=>{ri=+e.target.value;si=0;setNo=1;render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('start').onclick=start;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'계속':'일시정지';if(paused){clearTimeout(timer);speechSynthesis.cancel()}else schedule()};$('reset').onclick=()=>{clearTimeout(timer);running=paused=false;si=0;setNo=1;$('start').textContent='시작';$('pause').textContent='일시정지';$('pause').disabled=true;render()};
init();
</script>
</body>
</html>
