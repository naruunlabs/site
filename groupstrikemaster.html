<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050609">
<title>AI STRIKE MASTER · 단체 콤비네이션</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>

:root{--acc:#B26BFF;--acc-lit:#D8B4FE;--acc-deep:#7E22CE;--acc2:#E879F9;--acc-rgb:178,107,255;--next:#BEF264;--next-rgb:190,242,100;--left:#7DD3FC;--right:#F0ABFC;--front:#7DD3FC;--rear:#F5A3FF;--ok:#51ff9d;--bg0:#2a2238;--bg1:#130f1c;--bg2:#06050a;--line:rgba(255,255,255,.12)}

*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg2);color:#fff;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,select{font:inherit}button{border:0;cursor:pointer;color:inherit;background:none}
.app{position:relative;height:100%;background:radial-gradient(circle at 50% 38%,var(--bg0) 0,var(--bg1) 36%,var(--bg2) 80%)}

.side{position:absolute;inset:0;z-index:12;pointer-events:none}
.side>*{pointer-events:auto}
.brand{position:absolute;top:24px;left:28px;font-size:15px;font-weight:900;letter-spacing:.15em}.brand em{color:var(--acc);font-style:normal}
.version{position:absolute;top:48px;left:28px;color:#667085;font-size:10px;font-weight:800;letter-spacing:.08em}
.control-stack{position:absolute;left:28px;top:clamp(92px,13vh,128px);bottom:18px;width:232px;display:flex;flex-direction:column;gap:clamp(7px,1.15vh,12px);overflow-y:auto;overscroll-behavior:contain;padding:0 4px 2px 0;scrollbar-width:thin}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-bottom:1px solid var(--line)}
.tabs button{padding:9px 2px 10px;border-bottom:3px solid transparent;color:rgba(255,255,255,.48);font-size:13px;font-weight:900;transition:color .2s,border-color .2s}
.tabs button.on{color:#fff;border-bottom-color:var(--acc)}
.stage-hint{margin-top:-2px;color:#6b7588;font-size:10.5px;font-weight:700;line-height:1.45}
.field{display:block}.field span{display:block;margin-bottom:3px;color:#697386;font-size:10px;font-weight:800;letter-spacing:.04em}
.field select{width:100%;height:36px;padding:0 4px;border:0;border-bottom:1px solid rgba(255,255,255,.18);border-radius:0;background:transparent;color:#fff;font-size:14px;font-weight:700;outline:none}
.field select:focus-visible{border-bottom-color:var(--acc)}
.field option{background:#161922}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.speed-note{margin-top:-4px;color:#7d8798;font-size:10.5px;font-weight:700;line-height:1.4}.speed-note b{color:#fff}.speed-note i{font-style:normal;color:var(--acc2)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:7px}
.actions button{min-height:34px;color:rgba(255,255,255,.72);font-size:12px;font-weight:900}
.actions button:hover,.actions button:focus-visible{color:#fff;background:rgba(255,255,255,.045)}
.actions button:disabled{opacity:.3;cursor:default;background:none}
.actions .start{grid-column:1/-1;min-height:46px;color:var(--acc);font-size:18px;border-bottom:2px solid rgba(var(--acc-rgb),.72)}
.actions .ok{color:var(--ok)}
.actions .exit{grid-column:1/-1;min-height:38px;color:#9aa5b5;border-top:1px solid rgba(255,255,255,.12)}
.remote-tip{color:#566074;font-size:10px;font-weight:700;line-height:1.5;text-align:center}.remote-tip b{color:#8a94a6}

.stage{position:absolute;inset:0;overflow:hidden}
.top{position:absolute;z-index:4;top:22px;left:50%;width:min(620px,48vw);transform:translateX(-50%);text-align:center}
.routine-name{font-size:20px;font-weight:900;letter-spacing:.04em}
.progress{height:4px;margin-top:12px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--acc-deep),var(--acc));transition:width .3s}
.meta{display:flex;justify-content:space-between;margin-top:8px;color:#9aa4b4;font-size:13px;font-weight:800}.meta b{color:#fff}
.fs{position:absolute;z-index:14;top:22px;right:28px;padding:7px 11px;border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#aab3c2;font-size:11px;font-weight:900;background:rgba(5,8,14,.5)}
.fs:hover{color:#fff}

.cue{position:absolute;z-index:4;top:14.5%;left:50%;width:min(640px,calc(100vw - 580px));min-width:300px;transform:translateX(-50%);text-align:center}
.cue .beat{font-size:12px;font-weight:900;letter-spacing:.24em;color:var(--acc-lit)}
.cue h2{margin-top:6px;white-space:nowrap;font-size:clamp(40px,5.6vw,86px);line-height:1.04;letter-spacing:-.05em;text-shadow:0 6px 24px rgba(0,0,0,.75);transition:opacity .2s}
.cue h2.soft{color:rgba(255,255,255,.62);font-size:clamp(30px,3.8vw,56px)}
.cue h2 .sw-left{color:var(--left)}.cue h2 .sw-right{color:var(--right)}.cue h2 .sw-front{color:var(--front)}.cue h2 .sw-rear{color:var(--rear)}
.cue h2 small{display:inline-block;margin-left:.3em;padding:.12em .42em;border-radius:.4em;font-size:.3em;letter-spacing:0;vertical-align:.9em;background:rgba(255,255,255,.1);color:#dfe4ec}
.cue p{margin-top:9px;color:#b6bfcc;font-size:clamp(13px,1.25vw,18px);font-weight:700;min-height:1.4em}
.dots{display:flex;justify-content:center;gap:9px;margin-top:14px;height:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.14);transition:background .12s,transform .12s}
.dots i.done{background:rgba(255,255,255,.34)}.dots i.on{background:var(--acc);transform:scale(1.35);box-shadow:0 0 12px rgba(var(--acc-rgb),.9)}

.floor{position:absolute;left:0;right:0;bottom:0;height:53%;background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(255,255,255,.055));clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}
.floor:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 99px,rgba(255,255,255,.025) 100px),repeating-linear-gradient(0deg,transparent 0 70px,rgba(255,255,255,.025) 71px);transform:perspective(480px) rotateX(54deg);transform-origin:center bottom}
.arena{position:absolute;inset:0;z-index:1;pointer-events:none}
.guide-canvas{position:absolute;inset:0;width:100%;height:100%}
.floor{background:linear-gradient(180deg,rgba(178,107,255,.02),rgba(178,107,255,.07))}

.rail{position:absolute;z-index:5;top:112px;right:28px;width:216px;text-align:right}
.st{position:relative;padding:10px 0 13px}
.st:after{content:"";position:absolute;right:0;bottom:0;width:100%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14))}
.st-lab{color:#8f99aa;font-size:12px;font-weight:800;letter-spacing:.04em}
.st-name{margin-top:4px;font-size:clamp(22px,2.3vw,34px);font-weight:900;letter-spacing:-.03em;line-height:1.15;word-break:keep-all}
.st-name small{display:block;margin-top:3px;font-size:.52em;color:#aab3c2;letter-spacing:0}
.st-val{margin-top:2px;font-size:clamp(34px,3.4vw,50px);font-weight:900;letter-spacing:-.04em;line-height:1}.st-val small{margin-left:4px;font-size:.36em;color:#aab3c2;letter-spacing:0}
.st.next .st-name{color:rgba(255,255,255,.4);transition:color .2s}
.st.next.on .st-name{color:var(--next)}.st.next.on:after{background:linear-gradient(90deg,transparent,var(--next))}
.st .when{display:block;margin-top:3px;color:#6b7588;font-size:11px;font-weight:800}
.st.next .when{display:block;margin-top:3px;color:rgba(255,255,255,.35);font-size:13px;font-weight:900}
.st.next.on .when{color:#fff}
.st.done:after{background:linear-gradient(90deg,transparent,var(--acc))}
.st.okst:after{background:linear-gradient(90deg,transparent,var(--ok))}.st.okst .st-val{color:var(--ok)}

.strip{position:absolute;z-index:5;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;max-width:calc(100vw - 580px);flex-wrap:nowrap}
.chip{padding:7px 12px;border-radius:999px;background:rgba(5,8,14,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#8d97a8;font-size:13px;font-weight:800;white-space:nowrap;transition:all .18s}
.chip.soft{font-size:11px;padding:6px 9px;color:#687285}
.chip.now{color:#fff;background:rgba(var(--acc-rgb),.26);box-shadow:inset 0 0 0 1.5px var(--acc)}
.chip.next{color:var(--next);box-shadow:inset 0 0 0 1.5px rgba(var(--next-rgb),.55)}
.chip.done{color:rgba(255,255,255,.3)}
.strip .arr{color:#4b5465;font-size:12px;font-weight:900}
.side-note{position:absolute;z-index:5;right:28px;bottom:24px;display:flex;align-items:center;gap:7px;color:#8a94a6;font-size:11.5px;font-weight:800}
.side-note:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--next);box-shadow:0 0 10px var(--next)}

.kiai{position:absolute;z-index:7;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-size:clamp(60px,9vw,140px);font-weight:900;letter-spacing:-.04em;color:#fff;text-shadow:0 0 30px rgba(var(--acc-rgb),.95),0 0 80px rgba(var(--acc-rgb),.55)}
.kiai.show{animation:kiai .75s cubic-bezier(.2,1.4,.4,1) both}
@keyframes kiai{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}}
.okflash{position:absolute;z-index:7;left:50%;top:34%;transform:translateX(-50%);padding:10px 20px;border-radius:999px;background:rgba(10,40,24,.85);box-shadow:inset 0 0 0 1.5px var(--ok),0 0 30px rgba(81,255,157,.35);color:var(--ok);font-size:18px;font-weight:900;opacity:0;pointer-events:none}
.okflash.show{animation:okf .9s ease both}
@keyframes okf{0%{opacity:0;transform:translate(-50%,8px)}20%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}

.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:rgba(3,4,7,.78);backdrop-filter:blur(6px)}
.overlay[hidden]{display:none}
.overlay .box{text-align:center;padding:0 24px}
.overlay b.big{display:block;font-size:min(20vw,180px);line-height:1;font-weight:900;letter-spacing:-.04em}
.overlay b.big.pz{font-size:min(9vw,84px);color:var(--acc-lit);letter-spacing:-.02em}
.overlay .sub{display:block;margin-top:14px;color:#c3cad6;font-size:clamp(15px,1.6vw,22px);font-weight:800}
.overlay .lab{display:block;color:#b8c1ce;font-weight:900;letter-spacing:.06em}
.rest b.big{margin-top:10px;color:var(--next)}
.rest em{display:block;margin-top:16px;font-style:normal;color:#dfe4ec;font-size:clamp(16px,1.7vw,24px);font-weight:900}.rest em i{font-style:normal;color:var(--next)}
.cd-seq{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:22px}
.cd-seq .chip{font-size:15px;padding:9px 15px}
.finish .card{min-width:min(460px,86vw);padding:30px 30px 24px;border-radius:18px;background:linear-gradient(180deg,rgba(24,28,38,.94),rgba(10,12,18,.94));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.6);text-align:center}
.finish h3{font-size:34px;font-weight:900;letter-spacing:-.04em}.finish h3 em{font-style:normal;color:var(--acc)}
.finish .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.finish .sum div{padding:14px 6px;border-radius:12px;background:rgba(255,255,255,.05)}
.finish .sum span{display:block;color:#8f99aa;font-size:12px;font-weight:800}.finish .sum b{display:block;margin-top:6px;font-size:28px;font-weight:900}
.finish .sum .g b{color:var(--ok)}
.finish p{margin-top:14px;color:#8f99aa;font-size:12.5px;font-weight:700;line-height:1.5}
.finish .row{display:flex;gap:10px;justify-content:center;margin-top:20px}
.finish .row button{min-width:130px;min-height:44px;border-radius:10px;font-weight:900;background:rgba(255,255,255,.08)}
.finish .row .again{background:linear-gradient(135deg,var(--acc),var(--acc-deep))}

.app.stage-call .cue h2,.app.stage-call .st.next .st-name{letter-spacing:.2em}

@media(max-width:1100px){.rail{width:176px;right:18px}.st-name{font-size:20px}.st-val{font-size:34px}.cue{width:min(560px,calc(100vw - 480px))}.strip{max-width:calc(100vw - 480px)}.chip{font-size:12px;padding:6px 10px}.side-note{display:none}}
@media(max-width:860px){.brand{left:16px;top:15px}.version{left:16px;top:38px}.control-stack{left:16px;width:190px}.rail{top:96px;width:150px;right:12px}.cue{top:12%;min-width:0;width:calc(100vw - 390px)}.cue h2{font-size:clamp(30px,5vw,54px)}.top{width:44vw}.fs{right:12px;top:14px}.strip{bottom:12px;max-width:calc(100vw - 390px);overflow:hidden}}
@media(max-height:650px){.control-stack{top:74px;bottom:8px;gap:5px}.tabs button{padding:6px 2px 7px}.field select{height:31px}.actions{padding-top:4px}.actions button{min-height:28px}.actions .start{min-height:38px}.actions .exit{min-height:32px}.brand{top:14px}.version{top:36px}.rail{top:88px}.st{padding:6px 0 9px}.stage-hint,.remote-tip{display:none}}
</style>
</head>
<body>
<main class="app stage-follow" id="app">
  <aside class="side">
    <div class="brand">AI <em>STRIKE</em> MASTER</div><div class="version">GROUP COMBINATION · v1.0</div>
    <div class="control-stack">
      <div class="tabs" role="tablist"><button class="on" data-stage="follow">따라하기</button><button data-stage="memory">기억해서</button><button data-stage="call">구령만</button></div>
      <div class="stage-hint" id="stageHint"></div>
      <label class="field"><span>루틴</span><select id="routine"></select></label>
      <label class="field"><span>자세</span><select id="stance"><option value="orth">왼발 앞 · 앞손 = 왼손</option><option value="south">오른발 앞 · 앞손 = 오른손</option></select></label>
      <div class="grid"><label class="field"><span>속도</span><select id="bpm"><option value="60">느리게 · 60</option><option value="80" selected>기본 · 80</option><option value="100">빠르게 · 100</option><option value="120">매우 빠르게 · 120</option></select></label><label class="field"><span>세트</span><select id="sets"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label></div>
      <div class="speed-note" id="speedNote"></div>
      <div class="grid"><label class="field"><span id="goalLab">세트 목표</span><select id="kickGoal"></select></label><label class="field"><span>세트 휴식</span><select id="rest"><option value="10">10초</option><option value="15" selected>15초</option><option value="20">20초</option><option value="30">30초</option></select></label></div>
      <div class="actions">
        <button class="start" id="start">시작</button>
        <button id="pause" disabled>일시정지</button><button id="reset">처음으로</button>
        <button id="again" disabled>이 묶음 다시</button><button class="ok" id="confirm" disabled>지도자 확인 ✓</button>
        <button class="exit" id="exitGroup">단체모드 종료 · 모드 선택으로</button>
      </div>
      <div class="remote-tip">리모컨 <b>▶</b> 확인 · <b>◀</b> 다시 · <b>Space</b> 정지</div>
    </div>
  </aside>
  <section class="stage" id="stage">
    <div class="top"><div class="routine-name" id="routineName"></div><div class="progress"><i id="progress"></i></div><div class="meta"><span id="countText"></span><span id="setText"></span></div></div>
    <button class="fs" id="fsBtn" type="button">전체화면</button>
    <div class="cue"><div class="beat" id="beat">READY</div><h2 id="cue">준비 자세</h2><p id="detail"></p><div class="dots" id="dots"></div></div>
    <div class="floor"></div>
    <div class="arena" id="arena"><canvas class="guide-canvas" id="guideCanvas"></canvas></div>

    <div class="rail">
      <div class="st next" id="stNextBox"><div class="st-lab">다음 동작</div><div class="st-name" id="stNext">—</div><span class="when" id="stWhen">대기</span></div>
      <div class="st done"><div class="st-lab" id="stDoneLab">완주</div><div class="st-val" id="stDone">0<small>/ 10</small></div></div>
      <div class="st okst"><div class="st-lab">지도자 확인</div><div class="st-val" id="stOk">0<small>묶음</small></div><span class="when" id="stOkNote"></span></div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="side-note">좌우는 학생 기준 · 화면 오른쪽 = 내 오른쪽</div>
    <div class="kiai" id="kiai">기합!</div>
    <div class="okflash" id="okFlash">✓ 지도자 확인</div>
    <div class="overlay countdown" id="countdown" hidden><div class="box"><b class="big" id="countNum">3</b><span class="sub" id="countSub"></span><div class="cd-seq" id="cdSeq"></div></div></div>
    <div class="overlay rest" id="restScreen" hidden><div class="box"><span class="lab">다음 세트 준비</span><b class="big" id="restNum">15</b><em id="restNext"></em></div></div>
    <div class="overlay finish" id="finishScreen" hidden><div class="card"><h3>운동 <em>끝</em></h3><div class="sum" id="finishSum"></div><p id="finishNote">완주는 화면 진행 기준이고, 지도자 확인은 관장님이 눌러 준 묶음입니다.</p><div class="row"><button class="again" id="finAgain">다시 시작</button><button id="finClose">닫기</button></div></div></div>
  </section>
</main>
<script>

const A=(n,t,limb,b,d,o={})=>Object.assign({n,t,limb,b,d},o);
const R=(n,b,d,o={})=>Object.assign({n,t:'ready',b,d},o);
const PRODUCT={
  key:'strike', storeKey:'asm_group_settings_v1', exitUrl:'aistrikemaster.html',
  goals:{single:[6,10,20,30],combo:[4,6,10,15]}, defGoal:{single:10,combo:6},
  hints:{
    follow:'궤적 · 이름 구령을 모두 보여줘요. 타격음에 뻗습니다.',
    memory:'궤적은 숨기고 숫자로 구령해요. 다음 동작은 화면으로만 예고합니다.',
    call:'궤적 없이 순서만 보여요. 콤보 구령을 듣고 뻗습니다.'
  },
  okNote:'확인 기준 · 순서 · 반대손 가드 · 마지막 복귀',
  routines:[
    {id:'jab',name:'앞손 잽 기초',type:'single',intro:{n:'가드 자세',d:'양손은 턱 옆, 턱은 당기고 앞발은 앞으로'},cycle:[
      A('앞손 잽','jab','fh',2,'앞손을 곧게 뻗고 바로 가드로',{call:'잽',chip:'잽'}),
      R('가드',2,'반대손은 턱 옆에 그대로',{chip:'가드'})]},
    {id:'one-two',name:'잽 → 스트레이트 → 가드',type:'combo',intro:{n:'가드 자세',d:'양손을 턱 옆에, 앞발은 앞으로'},cycle:[
      A('앞손 잽','jab','fh',1,'앞손을 곧게, 반대손은 턱 옆',{call:'잽',chip:'잽'}),
      A('뒷손 스트레이트','cross','rh',1,'뒷발 뒤꿈치를 돌리며 어깨까지 뻗습니다',{chain:true,call:'스트레이트',chip:'스트레이트'}),
      R('가드 복귀',2,'두 손 모두 턱 옆으로',{end:true,chip:'가드'})]},
    {id:'one-two-low',name:'잽 → 스트레이트 → 로킥',type:'combo',intro:{n:'가드 자세',d:'앞발은 앞으로, 무게는 가운데'},cycle:[
      A('앞손 잽','jab','fh',1,'앞손을 곧게, 반대손은 턱 옆',{call:'잽',chip:'잽'}),
      A('뒷손 스트레이트','cross','rh',1,'뒷발 뒤꿈치를 돌리며 뻗습니다',{chain:true,call:'스트레이트',chip:'스트레이트'}),

function createTrainingClock(host){

  },Math.max(0,t.due-now())); }

  const clear=id=>{const t=timers.get(id);if(t){cancel(t.handle);timers.delete(id);}};
  return {now,realNow,later,cancel,get paused(){return frozen!==null;},
    setTimeout:(fn,ms,...args)=>add(fn,ms,false,args),clearTimeout:clear,
    setInterval:(fn,ms,...args)=>add(fn,ms,true,args),clearInterval:clear,
    pause(){if(frozen!==null)return;frozen=realNow();for(const t of timers.values())cancel(t.handle);},
    resume(){if(frozen===null)return;offset+=realNow()-frozen;frozen=null;for(const [id,t]of timers)arm(id,t);}
  };

  setControls();keepAwake(true);ensureAudio();
  const first=TL.steps[firstPhrase()];
  V.upcoming=first;V.announced=true;V.cur=null;V.idle=false;
  paintAll();
  $('countdown').hidden=false;$('countSub').textContent=`${STAGE_NAME[stage]} · 첫 동작 ${P.plain(first)}`;paintSeq($('cdSeq'));
  for(const n of ['3','2','1','시작']){
    if(token!==runToken) return;
    $('countNum').classList.remove('pz');$('countNum').textContent=n;beep(n==='시작'?900:560);
    await sleep(700);
  }
  if(token!==runToken) return;
  $('countdown').hidden=true;
  runFrom(firstPhrase(),'start');
}
async function endSet(token){
  segToken++;clearTimeout(tickTimer);clearTimeout(sayTimer);
  if(token!==runToken) return;
  if(setNo<+$('sets').value){
    phase='rest';const sec=+$('rest').value;
    const first=TL.steps[firstPhrase()];
    $('restNext').innerHTML=`${setNo+1}세트 첫 동작 · <i>${P.plain(first)}</i>`;
    $('restScreen').hidden=false;speak('잘했어요. 쉬어요');
    for(let n=sec;n>0;n--){if(token!==runToken)return;$('restNum').textContent=n;if(n<=3)beep(520);await sleep(1000);}
    if(token!==runToken) return;
    setNo++;count=bundles=confirmed=0;$('restScreen').hidden=true;paintCounts();
    runFrom(firstPhrase(),'set');
  }else finishAll();
}
function finishAll(){
  running=false;paused=false;phase='done';segToken++;clearTimeout(tickTimer);clearTimeout(sayTimer);
  keepAwake(false);speak('운동 끝');chime();
  const sets=+$('sets').value;
  $('finishSum').innerHTML=`<div><span>세트</span><b>${sets}</b></div><div><span>완주</span><b>${totalDone}<small style="font-size:.5em;color:#aab3c2"> ${unit()}</small></b></div><div class="g"><span>지도자 확인</span><b>${totalOk}</b></div>`;
  $('finishScreen').hidden=false;$('beat').textContent='FINISH';
  setControls();
}
function stopAll(){
  runToken++;segToken++;resumeToken++;clearTimeout(tickTimer);clearTimeout(sayTimer);
  running=paused=false;phase='idle';trainingClock.resume();cancelSpeech();keepAwake(false);
  ['countdown','restScreen','finishScreen'].forEach(id=>$(id).hidden=true);
}
function reset(){stopAll();setNo=1;count=bundles=confirmed=0;idleView();setControls();}

function togglePause(){
  if(!running||document.hidden) return;
  if(!paused) pauseNow(); else resumeNow();
}
function pauseNow(){
  if(!running||paused) return;
  paused=true;trainingClock.pause();cancelSpeech();
  if(phase==='run'){
    segToken++;clearTimeout(tickTimer);clearTimeout(sayTimer);
    const st=curStep();
    resumeIdx=st.intro?seg.target:phraseStartOf(nextActionAfter(seg.si));
    $('countdown').hidden=false;$('countNum').textContent='잠시 멈춤';$('countNum').classList.add('pz');
    $('countSub').textContent=`잠시 멈춤 · 계속을 누르면 3초 뒤 ${P.plain(TL.steps[resumeIdx])}부터`;$('cdSeq').innerHTML='';
  }else if(phase==='countdown'||phase==='resume') $('countSub').textContent='잠시 멈춤 · 계속을 누르면 이어서 셉니다';
  setControls();
}
function resumeNow(){
  if(!paused) return;
  paused=false;trainingClock.resume();if(audio?.state==='suspended')audio.resume().catch(()=>{});
  keepAwake(true);
  if(phase==='run'&&resumeIdx!=null) resumeRun(resumeIdx);
  else if(phase==='countdown') $('countSub').textContent=`${STAGE_NAME[stage]} · 첫 동작 ${P.plain(TL.steps[firstPhrase()])}`;
  setControls();
}
async function resumeRun(idx){
  const tok=++resumeToken, token=runToken;phase='resume';
  $('countdown').hidden=false;$('countSub').textContent=`이어서 · ${P.plain(TL.steps[idx])}`;
  for(const n of ['3','2','1']){if(tok!==resumeToken||token!==runToken)return;$('countNum').classList.remove('pz');$('countNum').textContent=n;beep(560);await sleep(1000);}
  if(tok!==resumeToken||token!==runToken) return;
  $('countdown').hidden=true;runFrom(idx,'resume');
}
function againBundle(){
  if(!running||phase!=='run'||paused) return;
  const st=curStep();let idx;
  if(st.intro) idx=seg.target;
  else if(isCombo()){let j=seg.si;for(let k=1;k<=TL.n;k++){const q=(seg.si-k+TL.n)%TL.n;if(TL.steps[q].end)break;j=q;}idx=phraseStartOf(TL.steps[j].act?j:nextActionAfter(j));}
  else{let j=st.act?seg.si:(seg.si-1+TL.n)%TL.n;for(let k=0;k<TL.n&&!TL.steps[j].act;k++)j=(j-1+TL.n)%TL.n;idx=phraseStartOf(j);if(count>0){count--;totalDone=Math.max(0,totalDone-1);}}
  cancelSpeech();runFrom(idx,'again');paintCounts();
}
function confirmOne(){
  if(!running) return;
  if(confirmed>=done()){flashOk('확인할 완주가 아직 없어요',true);return;}
  confirmed++;totalOk++;paintCounts();flashOk(`✓ 지도자 확인 ${confirmed} / ${done()}`);
  tone(1320,.08,'sine',.12);setTimeout(()=>tone(1760,.12,'sine',.1),90);
}

function ensureAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){audio=null}return audio;}
function tone(freq,dur=.1,type='sine',vol=.07){try{const a=ensureAudio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
function beep(freq=620){tone(freq,.1,'sine',.07);}
function chime(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sine',.1),i*110));}
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];koVoice=vs.find(v=>/ko[-_]KR/i.test(v.lang)&&/Google|Neural|Natural/i.test(v.name))||vs.find(v=>/^ko/i.test(v.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(t){if(!t)return;try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=VOICE_RATE;if(koVoice)u.voice=koVoice;s.speak(u);}catch(e){}}
function cancelSpeech(){try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}

async function keepAwake(on){
  try{
    if(on){if(wakeLock||!navigator.wakeLock||document.hidden)return;wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener&&wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){wakeLock=null;}
}
function toggleFs(){
  if(HOST){try{HOST.toggleHostFullscreen();}catch(e){}return;}
  const d=document,el=d.documentElement;
  try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else (el.requestFullscreen||el.webkitRequestFullscreen).call(el);}catch(e){}
}
function paintFs(){let fs=false;try{fs=!!(HOST?HOST.document.fullscreenElement:document.fullscreenElement);}catch(e){}$('fsBtn').textContent=fs?'창 모드':'전체화면';}
document.addEventListener('fullscreenchange',paintFs);
try{HOST&&HOST.document.addEventListener('fullscreenchange',paintFs);}catch(e){}

function paintAll(){paintHead();paintStep(V.cur);paintCounts();paintNext();paintStrip();}
function paintHead(){
  const r=routine();$('routineName').textContent=r.name;
  $('stageHint').textContent=P.hints[stage];
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.stage===stage));
  $('app').className=`app stage-${stage}`;
  const note=TL.capped?` · <i>구령 이름을 말할 시간이 필요해 ${TL.bpm}으로 진행</i>`:'';
  $('speedNote').innerHTML=`${isCombo()?'한 묶음':'동작 간격'} 약 <b>${TL.unitSec.toFixed(1)}초</b>${note}`;
  $('goalLab').textContent=isCombo()?'세트 목표 · 묶음':'세트 목표 · 횟수';
}

function previewing(){return !!(running&&phase==='run'&&V.announced&&V.upcoming&&V.upcoming.act&&V.cur!==V.upcoming);}
function paintPreview(){
  if(!previewing()) return;
  const u=V.upcoming,h=$('cue'),p=$('detail');
  h.className='';
  h.innerHTML=stage==='call'?(u.counted?`${u.ord}<span style="color:#5b6577"> / ${u.of}</span>`:'·'):P.label(u);
  p.textContent=stage==='follow'?(u.d||''):'';
  paintPreviewBeat();fitCue();
}
function paintPreviewBeat(){const b=beatsUntilUpcoming();$('beat').textContent=b<=0?'준비':`준비 · ${b}박 후`;}
function paintStep(st){
  if(st&&!st.intro&&!st.act&&previewing()){paintPreview();paintNext();paintStrip();return;}
  const h=$('cue'),p=$('detail'),b=$('beat');
  if(!st){h.className='';h.innerHTML=P.label({n:routine().intro.n,t:'ready'});p.textContent=V.idle?'시작을 누르면 3초 뒤 시작합니다':routine().intro.d;b.textContent='READY';paintStrip();fitCue();return;}
  const call=stage==='call';
  if(st.intro){h.className='soft';h.innerHTML=st.n;p.textContent=st.d||'';b.textContent='준비';}
  else if(st.act){
    h.className='';
    h.innerHTML=call?(st.counted?`${st.ord}<span style="color:#5b6577"> / ${st.of}</span>`:'·'):P.label(st);
    p.textContent=stage==='follow'?(st.d||''):'';
    b.textContent=stage==='memory'&&st.counted?countWord(st):(st.quiet?'준비 동작':'지금');
  }else{h.className='soft';h.innerHTML=call?'·':st.n;p.textContent=stage==='follow'?(st.d||''):'';b.textContent=st.end?'한 묶음 완료':'복귀';}
  paintNext();paintStrip();fitCue();
}
function paintNext(){
  const box=$('stNextBox'),u=V.upcoming;
  if(!u){$('stNext').textContent='—';$('stWhen').textContent='대기';box.classList.remove('on');return;}
  $('stNext').innerHTML=stage==='call'?'구령을 들어요':P.label(u);
  box.classList.toggle('on',!!V.announced);
  if(running&&phase==='run'){const b=beatsUntilUpcoming();$('stWhen').textContent=V.announced?(b<=0?'지금':`${b}박 후`):'대기';}
  else $('stWhen').textContent=running?'곧':'첫 동작';
}
function paintCounts(){
  const g=goal(),d=done();
  $('countText').innerHTML=`<b>${d}</b> / ${g}${unit()}`;
  $('setText').innerHTML=`<b>${setNo}</b>세트 / ${$('sets').value}`;
  $('progress').style.width=Math.min(100,d/g*100)+'%';
  $('stDoneLab').textContent=isCombo()?'완주 묶음':'횟수';
  $('stDone').innerHTML=`${d}<small>/ ${g}</small>`;
  $('stOk').innerHTML=`${confirmed}<small>${unit()}</small>`;
}
function drawBeat(st){
  const box=$('dots'),n=Math.min(8,st.b);
  if(box.childElementCount!==n) box.innerHTML='<i></i>'.repeat(n);
  [...box.children].forEach((d,i)=>{d.className=i<seg.beat?'done':i===seg.beat?'on':'';});
  if(previewing())paintPreviewBeat();
  paintNext();
}
function paintStrip(){
  const el=$('strip');if(!TL){el.innerHTML='';return;}
  const call=stage==='call',cur=V.cur&&!V.cur.intro?V.cur.i:-1,up=V.upcoming?V.upcoming.i:-1;
  let bundleStart=0;
  if(cur>=0&&isCombo()){for(let k=1;k<=TL.n;k++){const q=(cur-k+TL.n)%TL.n;if(TL.steps[q].end){bundleStart=(q+1)%TL.n;break;}}}
  el.innerHTML=TL.steps.map((s,i)=>{
    const cls=['chip'];if(!s.act)cls.push('soft');
    const pv=previewing();
    if(i===cur&&!pv)cls.push('now');else if(i===up&&V.announced)cls.push(pv?'now':'next');else if(i===cur&&pv)cls.push('done');else if(cur>=0&&i<cur&&i>=bundleStart)cls.push('done');
    const txt=call?(s.act?(s.counted?String(s.ord):'·'):'복귀'):(s.chip||P.plain(s));
    return `<span class="${cls.join(' ')}">${txt}</span>${s.end&&i<TL.n-1?'<span class="arr">│</span>':i<TL.n-1?'<span class="arr">›</span>':''}`;
  }).join('');
}
function paintSeq(el){
  const r=routine();let steps=TL.steps;
  if(isCombo()){const e=steps.findIndex(s=>s.end);steps=steps.slice(0,e+1);}
  el.innerHTML=steps.filter(s=>s.act).map(s=>`<span class="chip">${P.plain(s)}</span>`).join('<span class="arr" style="align-self:center">›</span>');
}
function fitCue(){const h=$('cue');h.style.fontSize='';const w=h.parentElement.clientWidth;if(!w)return;let fs=parseFloat(getComputedStyle(h).fontSize)||60;let guard=0;while(h.scrollWidth>w&&fs>24&&guard++<30){fs-=3;h.style.fontSize=fs+'px';}}
function showKiai(){const k=$('kiai');k.classList.remove('show');void k.offsetWidth;k.classList.add('show');}
function flashOk(t,warn){const f=$('okFlash');f.textContent=t;f.style.color=warn?'#ffd166':'';f.classList.remove('show');void f.offsetWidth;f.classList.add('show');}
function setControls(){
  const live=running&&!paused;
  $('start').textContent=running?(paused?'멈춤':'진행 중'):phase==='done'?'다시 시작':'시작';
  $('start').disabled=running;
  $('pause').disabled=!running;$('pause').textContent=paused?'계속':'일시정지';
  $('again').disabled=!(running&&!paused);$('confirm').disabled=!running;
  document.querySelectorAll('.control-stack select,.tabs button').forEach(el=>{if(el.id==='sets'||el.id==='rest')return;el.disabled=running;});
}
function idleView(){
  compile();V.cur=null;V.idle=true;V.upcoming=TL.steps[firstPhrase()];V.announced=true;V.impactAt=-1;
  $('dots').innerHTML='';$('beat').textContent='READY';paintAll();
}

const gc=$('guideCanvas'),gx=gc.getContext('2d');
function frame(now){
  const box=gc.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,1.5),W=box.width,H=box.height;
  if(W&&H){
    if(gc.width!==Math.round(W*dpr)||gc.height!==Math.round(H*dpr)){gc.width=Math.round(W*dpr);gc.height=Math.round(H*dpr);}
    gx.setTransform(dpr,0,0,dpr,0,0);gx.clearRect(0,0,W,H);
    V.stage=stage;
    try{P.draw(gx,W,H,now,V);}catch(e){}
  }
  requestAnimationFrame(frame);
}

function fillRoutines(){$('routine').innerHTML=P.routines.map((r,i)=>`<option value="${i}">${r.name}${r.type==='combo'?' · 콤보':''}</option>`).join('');}
function fillGoals(keep){
  const t=routine().type,opts=P.goals[t],saved=store.load()['goal_'+t];
  const want=keep||saved||P.defGoal[t];
  $('kickGoal').innerHTML=opts.map(v=>`<option value="${v}">${v}${t==='combo'?'묶음':'회'}</option>`).join('');
  $('kickGoal').value=String(opts.includes(+want)?want:P.defGoal[t]);
}
function onSetting(){if(running)return;store.save();idleView();}
function bind(){
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(running)return;stage=b.dataset.stage;onSetting();});
  $('routine').onchange=e=>{ri=+e.target.value;fillGoals();onSetting();};
  ['bpm','kickGoal','sets','rest','stance'].forEach(id=>{if($(id))$(id).addEventListener('change',()=>{if(id==='sets'||id==='rest'){store.save();paintCounts();return;}onSetting();});});
  $('start').onclick=start;$('pause').onclick=togglePause;$('reset').onclick=reset;
  $('again').onclick=againBundle;$('confirm').onclick=confirmOne;$('fsBtn').onclick=toggleFs;
  $('finAgain').onclick=()=>{$('finishScreen').hidden=true;phase='idle';start();};
  $('finClose').onclick=()=>{$('finishScreen').hidden=true;reset();};
  $('exitGroup').onclick=()=>{stopAll();if(HOST){try{HOST.closeGroupOverlay();return;}catch(e){}}location.replace(P.exitUrl);};
  document.addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey) return;
    const k=e.key,a=el=>el&&el.tagName;
    const act=[' ','b','B','.','F5','Pause','MediaPlayPause'].includes(k)?'toggle':['ArrowRight','PageDown','Enter'].includes(k)?'ok':['ArrowLeft','PageUp'].includes(k)?'again':(k==='f'||k==='F')?'fs':'';
    if(!act) return;
    if(!running&&a(document.activeElement)==='SELECT') return;
    e.preventDefault();try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}catch(_){}
    if(act==='toggle') running?togglePause():(phase!=='countdown'&&start());
    else if(act==='ok') running?confirmOne():start();
    else if(act==='again') againBundle();
    else toggleFs();
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&running){pauseNow();try{audio&&audio.suspend();}catch(e){}}
    else if(!document.hidden&&running) keepAwake(true);
  });
}
function init(){
  const s=store.load();
  fillRoutines();
  const idx=P.routines.findIndex(r=>r.id===s.routine);ri=idx>=0?idx:0;$('routine').value=String(ri);
  if(STAGE_NAME[s.stage]) stage=s.stage;
  for(const id of ['bpm','sets','rest','stance']) if($(id)&&s[id]!=null&&[...$(id).options].some(o=>o.value===String(s[id]))) $(id).value=String(s[id]);
  fillGoals();bind();idleView();setControls();paintFs();
  if($('stOkNote')) $('stOkNote').textContent=P.okNote.replace('확인 기준 · ','');
  if($('finishNote')) $('finishNote').textContent=`완주는 화면 진행 기준입니다. 지도자 확인은 관장님이 보고 눌러 준 수입니다 (${P.okNote.replace('확인 기준 · ','기준: ')}).`;
  if(P.init) P.init();
  requestAnimationFrame(frame);
}
init();

</script>
