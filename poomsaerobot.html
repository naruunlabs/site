<style>
:root{--bg:#08111F;--panel:#101E33;--line:#4A3F22;--txt:#E8EEF6;--dim:#E9D49A;--glow:#F5B829}   
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
#main{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none}
#prog{left:32px;top:26px}
#prog .k{font-size:13px;letter-spacing:3px;color:#E9D49A;font-weight:700}
#prog .t{font-size:36px;font-weight:900}
#prog .bar{display:flex;align-items:center;gap:10px;margin-top:4px}
#prog .bar i{display:block;width:220px;height:10px;border-radius:5px;background:#1C2C45;overflow:hidden}
#prog .bar b{display:block;height:10px;width:0;background:var(--glow);transition:width .2s}
#prog .bar span{font-size:20px;font-weight:700}
#mv{left:32px;bottom:92px;background:var(--panel);border-radius:16px;padding:14px 20px;max-width:46vw}
#mv .n{font-size:15px;color:var(--dim);font-weight:700}
#mv .nm{font-size:26px;font-weight:900;white-space:nowrap}

#mv .nm span{display:block}
#mv .nm .arr{font-size:.7em;line-height:1.05;color:var(--dim)}
#call{right:48px;bottom:84px;font-size:min(96px,11vw);font-weight:900;letter-spacing:-2px;transition:transform .12s;white-space:nowrap}
#call.pop{transform:scale(1.15)}
#mirrorBox{position:fixed;right:28px;top:24px;width:230px;height:290px;border-radius:18px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
#mirrorBox .lb{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:15px;font-weight:700;color:var(--dim);z-index:2}
#mirror{width:100%;height:100%;display:block;transform:scaleX(-1)}

#footBox{position:fixed;right:270px;top:24px;width:210px;height:200px;border-radius:18px;background:var(--panel);border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
#footBox .lb{text-align:center;font-size:15px;font-weight:700;color:var(--dim);padding-top:8px}
#foot{flex:1;width:100%;min-height:0;display:block}
#footInfo{padding:6px 12px 10px;display:flex;flex-direction:column;gap:2px;text-align:center}
#fiName{font-size:17px;font-weight:900}
#fiSpec{font-size:12px;color:var(--dim);line-height:1.35}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:rgba(8,17,31,.85);border-top:1px solid var(--line);font-size:14px}
#ctl button,#ctl select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
#ctl button.on{border-color:var(--glow);color:#fff}
#ctl label{display:flex;align-items:center;gap:6px;color:var(--dim)}
#seek{flex:1 1 220px;accent-color:var(--glow)}
#ctl input[type=range]{accent-color:var(--glow)}

@media (max-width:1100px){#footBox{right:28px;top:324px;width:230px;height:190px}}
@media (max-width:700px){#footBox{right:12px;top:200px;width:140px;height:128px;border-radius:14px}#footBox .lb{display:none}#fiSpec{display:none}#fiName{font-size:13px}#footInfo{padding:2px 6px 6px}
  #mirrorBox{width:140px;height:180px;right:12px;top:12px}#prog .t{font-size:26px}#mv .nm{font-size:18px}#mv{bottom:140px}#call{bottom:140px}}

html.embed #ctl{display:none}
html.embed #prog{left:50%;transform:translateX(-50%);top:16px;text-align:center}
html.embed #prog .bar{justify-content:center}
html.embed #prog .k{display:none}
html.embed #mv{bottom:200px}   
html.embed #call{bottom:96px}

  <div style="font-size:12px;letter-spacing:.14em;color:#E9D49A">NARUUN LABS · POOMSAE</div>
  <div class="gt">품새마스터 · 로봇</div>
  <p class="gs">시험용 비공개 화면입니다.<br>품새마스터 마스터 라이선스(PMS-)로만 열립니다.</p>
  <input id="gateKey" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PMS-0000-XXXX-0000" aria-label="라이선스 키">
  <button id="gateBtn" type="button">인증하기</button>
  <div class="ge" id="gateErr" role="alert"></div>
</div></div>
<script>

(function(){
  var LS_AUTH='psm_lab_auth_v1';
  var VERIFY_URL='https://ebgoolsymyzkftvavpyj.supabase.co/functions/v1/verify-pms';
  var PUBKEY={"kty":"EC","crv":"P-256","x":"TRVuOcoZYEagtQgi5GRgUOSIkAjiW_aUS4O9U6cfK0I","y":"IknjHnofBQw-5FhVBgeI2hx9WFT4OIs90G4aPYBNbuc"};
  var LOCAL=(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1');
  var $=function(id){ return document.getElementById(id); };
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function b64u(s){ s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var bin=atob(s), out=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
  function checkTok(key,tok){
    if(!tok || !(window.crypto && crypto.subtle)) return Promise.resolve(null);
    var parts=String(tok).split('.'); if(parts.length!==2) return Promise.resolve(null);
    return crypto.subtle.importKey('jwk',PUBKEY,{name:'ECDSA',namedCurve:'P-256'},false,['verify'])
      .then(function(k){ return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,b64u(parts[1]),new TextEncoder().encode(parts[0])); })
      .then(function(ok){ if(!ok) return null; var c=JSON.parse(new TextDecoder().decode(b64u(parts[0])));
        if(c.k!==key) return null; if(!c.sxp||Date.now()>c.sxp) return null; if(c.exp&&Date.now()>c.exp) return null; return c; })
      .catch(function(){ return null; });
  }
  function deviceId(){ try{ var id=localStorage.getItem('psm_device_id');
    if(!id){ id='dev-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); localStorage.setItem('psm_device_id',id); } return id; }catch(e){ return 'dev-fallback'; } }
  var open; window.__psmGate=new Promise(function(r){ open=r; });
  function grant(){ $('gate').hidden=true; open(); }
  function lock(msg){ $('gate').hidden=false; $('gateErr').textContent=msg||''; }
  function login(){
    var key=$('gateKey').value.trim().toUpperCase(), btn=$('gateBtn');
    if(!/^PMS-/.test(key)){ $('gateErr').textContent='품새 라이선스 키(PMS-)를 입력해 주세요.'; return; }
    btn.disabled=true; btn.textContent='인증 중…'; $('gateErr').textContent='';
    var ac=new AbortController(), tm=setTimeout(function(){ ac.abort(); },9000);
    fetch(VERIFY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({license_key:key,device_id:deviceId()}),signal:ac.signal})
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res||!res.valid) throw new Error(res&&res.reason==='rate_limited'?'인증 시도가 너무 많습니다. 잠시 뒤 다시 해 주세요.':((res&&res.error)||'유효하지 않은 키입니다.'));
        if(!res.is_beta) throw new Error('마스터 라이선스 전용입니다.');
        return checkTok(key,res.tok).then(function(c){
          if(!c) throw new Error('인증 도장 확인에 실패했습니다.');
          lsSet(LS_AUTH,{key:key,dojang:res.dojang_name||'',tok:res.tok,at:Date.now()}); grant(); });
      })
      .catch(function(e){ lock(e&&e.name==='AbortError'?'인증 서버가 응답하지 않습니다. 인터넷을 확인해 주세요.':(e&&e.message?e.message:'인증에 실패했습니다.')); })
      .finally(function(){ clearTimeout(tm); btn.disabled=false; btn.textContent='인증하기'; });
  }
  $('gateBtn').addEventListener('click',login);
  $('gateKey').addEventListener('keydown',function(e){ if(e.key==='Enter') login(); });
  if(LOCAL && /[?&]fake=1/.test(location.search)){ grant(); return; }
  var a=lsGet(LS_AUTH,null);
  if(!a || !/^PMS-/.test(a.key||'') || !a.tok || Date.now()-a.at>7*86400000){ lock(''); return; }
  checkTok(a.key,a.tok).then(function(c){ if(c && c.bt) grant(); else lock('다시 인증해 주세요.'); });
})();
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

await window.__psmGate;
const D = window.PSM_SAMPLE;
{ const pk=document.getElementById('pick'); pk.value=new URLSearchParams(location.search).get('p')||'tg1';
  pk.addEventListener('change',()=>{ location.search='?p='+pk.value; }); }
if(D.title){ document.querySelector('#prog .t').textContent=D.title; document.title='품새마스터 로봇 · '+D.title; }
if(D.synth) document.querySelector('#prog .k').textContent='구령 따라하기 · 기록 없이 정답지로 만든 움직임';
const GLOW = new THREE.Color('#3D8BFF');
const COUNT = ['준비','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열','열하나','열둘','열셋','열넷','열다섯','열여섯','열일곱','열여덟','열아홉','스물','스물하나','스물둘'];   

const NF = D.t.length;
const raw = D.wl.map(w => { const a=[]; for(let i=0;i<33;i++) a.push(new THREE.Vector3(w[i*3], -w[i*3+1], -w[i*3+2])); return a; });

const CAM_TILT=(()=>{ const xs=[], zs=[];
  raw.forEach((p,f)=>{ const t=D.t[f]; if(!D.moves.some(m=>m.t0!=null&&t>=m.t0&&t<=m.t1)) return;
    const a=p[27].clone().add(p[28]).multiplyScalar(.5), s=p[11].clone().add(p[12]).multiplyScalar(.5), v=s.sub(a).normalize(); xs.push(v.x); zs.push(v.z); });
  const md=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1];};
  const v=new THREE.Vector3(md(xs),0,md(zs)); v.y=Math.sqrt(Math.max(0,1-v.x*v.x-v.z*v.z));
  const q=new THREE.Quaternion().setFromUnitVectors(v.normalize(),new THREE.Vector3(0,1,0));
  raw.forEach(p=>p.forEach(x=>x.applyQuaternion(q)));
  return {x:Math.asin(md(xs))*57.3, z:Math.asin(md(zs))*57.3}; })();

const SMOOTH_SIGMA=1.8;     
const HOLD_EDGE=140;        
function gauss(src,sigma){ const R=Math.ceil(sigma*3), w=[]; for(let k=-R;k<=R;k++) w.push(Math.exp(-k*k/(2*sigma*sigma)));
  return src.map((_,f)=>{ const out=[]; for(let i=0;i<33;i++){ const v=new THREE.Vector3(); let ws=0;
    for(let k=-R;k<=R;k++){ const g=f+k; if(g<0||g>=NF) continue; v.addScaledVector(src[g][i],w[k+R]); ws+=w[k+R]; } out.push(v.multiplyScalar(1/ws)); } return out; }); }
const medV=(list)=>{ const xs=list.map(v=>v.x).sort((a,b)=>a-b), ys=list.map(v=>v.y).sort((a,b)=>a-b), zs=list.map(v=>v.z).sort((a,b)=>a-b), m=list.length>>1; return new THREE.Vector3(xs[m],ys[m],zs[m]); };
const smooth3=(x)=>x*x*(3-2*x);
function holdWeight(f){ 
  const t=D.t[f]; let best=0, idx=-1;
  D.moves.forEach((m,j)=>{ if(m.t0==null) return; let w=0;
    if(t>=m.t0 && t<=m.t1) w=1; else if(t<m.t0 && t>m.t0-HOLD_EDGE) w=smooth3(1-(m.t0-t)/HOLD_EDGE); else if(t>m.t1 && t<m.t1+HOLD_EDGE) w=smooth3(1-(t-m.t1)/HOLD_EDGE);
    if(w>best){best=w;idx=j;} });
  return {w:best,j:idx}; }
const holdPose=D.moves.map(m=>{ if(m.t0==null) return null; const fs=[]; for(let f=0;f<NF;f++) if(D.t[f]>=m.t0&&D.t[f]<=m.t1) fs.push(f);
  if(!fs.length) return null; const out=[]; for(let i=0;i<33;i++) out.push(medV(fs.map(f=>raw[f][i]))); return out; });
const HW=[...Array(NF).keys()].map(holdWeight);
function makeClean(){ const g=gauss(raw,SMOOTH_SIGMA);
  return g.map((pose,f)=>{ const h=HW[f]; const hp=h.j>=0?holdPose[h.j]:null; if(!hp||h.w<=0) return pose; return pose.map((v,i)=>v.clone().lerp(hp[i],h.w)); }); }
const SW=[1,3,5,3,1];   
const smRawLight = raw.map((_,f)=>{ const out=[]; for(let i=0;i<33;i++){ const v=new THREE.Vector3(); let ws=0;
  for(let k=-2;k<=2;k++){ const g=f+k; if(g<0||g>=NF) continue; v.addScaledVector(raw[g][i],SW[k+2]); ws+=SW[k+2]; } out.push(v.multiplyScalar(1/ws)); } return out; });
const smClean=makeClean();

const mid=(a,b)=>a.clone().add(b).multiplyScalar(.5);
const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1];};
const L = (f)=>{ const p=smClean[f]; return {
  hipW:p[23].distanceTo(p[24]), shW:p[11].distanceTo(p[12]), torso:mid(p[11],p[12]).distanceTo(mid(p[23],p[24])),
  neck:mid(p[11],p[12]).distanceTo(mid(p[7],p[8])),
  upL:p[11].distanceTo(p[13]), upR:p[12].distanceTo(p[14]), foL:p[13].distanceTo(p[15]), foR:p[14].distanceTo(p[16]),
  thL:p[23].distanceTo(p[25]), thR:p[24].distanceTo(p[26]), shL:p[25].distanceTo(p[27]), shR:p[26].distanceTo(p[28]),
  ftL:p[29].distanceTo(p[31]), ftR:p[30].distanceTo(p[32]) }; };
const all=[...Array(NF).keys()].map(L), M={};
for(const k in all[0]) M[k]=med(all.map(o=>o[k]));
const DIM={ hipHalf:M.hipW/2, shHalf:M.shW/2, torso:M.torso, neck:M.neck*0.55,
  up:(M.upL+M.upR)/2, fo:(M.foL+M.foR)/2, th:(M.thL+M.thR)/2, sh:(M.shL+M.shR)/2, ft:(M.ftL+M.ftR)/2 };

const ARM_SCALE=1.18; DIM.up*=ARM_SCALE; DIM.fo*=ARM_SCALE;

const bodyH = DIM.torso + DIM.th + DIM.sh + DIM.neck + 0.06;
const HEAD_BASE = bodyH/4;

const dirTo=(a,b)=>b.clone().sub(a).normalize();
function frameBasis(xL, upHint){ 
  const y=upHint.clone().normalize(); const x=xL.clone().addScaledVector(y,-xL.dot(y)).normalize(); const z=new THREE.Vector3().crossVectors(x,y); return {x,y,z}; }

function build(p,clean){
  const hipM=mid(p[23],p[24]), shM=mid(p[11],p[12]);
  const up=dirTo(hipM,shM);
  const pel=frameBasis(p[23].clone().sub(p[24]), up);
  const che=frameBasis(p[11].clone().sub(p[12]), up);
  const J={pel, che};
  J.hip=hipM.clone();
  J.hipL=hipM.clone().addScaledVector(pel.x, DIM.hipHalf); J.hipR=hipM.clone().addScaledVector(pel.x,-DIM.hipHalf);
  J.chest=hipM.clone().addScaledVector(up, DIM.torso);
  J.shL=J.chest.clone().addScaledVector(che.x, DIM.shHalf); J.shR=J.chest.clone().addScaledVector(che.x,-DIM.shHalf);
  const chain=(a,ia,ib,len)=>a.clone().addScaledVector(dirTo(p[ia],p[ib]),len);
  J.elL=chain(J.shL,11,13,DIM.up); J.elR=chain(J.shR,12,14,DIM.up);
  J.wrL=chain(J.elL,13,15,DIM.fo); J.wrR=chain(J.elR,14,16,DIM.fo);
  J.knL=chain(J.hipL,23,25,DIM.th); J.knR=chain(J.hipR,24,26,DIM.th);
  J.anL=chain(J.knL,25,27,DIM.sh); J.anR=chain(J.knR,26,28,DIM.sh);
  
  J.hdL={d:dirTo(p[15],mid(p[17],p[19])), s:dirTo(p[17],p[19])}; J.hdR={d:dirTo(p[16],mid(p[18],p[20])), s:dirTo(p[18],p[20])};
  
  J.ftL=dirTo(p[29],p[31]); J.ftR=dirTo(p[30],p[32]);
  const earM=mid(p[7],p[8]);
  J.headUp=dirTo(shM,earM); J.headF=dirTo(earM,p[0]);
  if(clean){ 
    J.hdL.d=dirTo(J.elL,J.wrL).lerp(J.hdL.d,.3).normalize(); J.hdR.d=dirTo(J.elR,J.wrR).lerp(J.hdR.d,.3).normalize(); }
  if(clean){ 
    J.headUp=che.y.clone().lerp(J.headUp,HEAD_MIX.up).normalize(); J.headF=che.z.clone().lerp(J.headF,HEAD_MIX.f).normalize(); }
  
  const low=Math.min(J.anL.y, J.anR.y);
  J.floor=low;
  
  return J;
}
const HEAD_MIX={up:.5,f:.35};
const gauss1=(a,sigma)=>{ const R=Math.ceil(sigma*3); return a.map((_,i)=>{let s=0,n=0;for(let k=-R;k<=R;k++){const g=i+k;if(g<0||g>=NF)continue;const w=Math.exp(-k*k/(2*sigma*sigma));s+=a[g]*w;n+=w;}return s/n;}); };

const TORSO_Y0=.10;                         
const SH_W=DIM.shHalf+.035, WAIST_W=Math.max(DIM.hipHalf+.06, SH_W*.84);
const CORR_IN=320, CORR_OUT=180;

const FOOT=(DIM.th+DIM.sh)*.34;                         

const ATT={HALF:.055, BOW:32};    
const sm3=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function attnW(t){
  if(D.attn!=null && D.moves[0].t0!=null && t<D.moves[0].t0){ return 1-sm3((t-D.attn)/Math.max(1,D.moves[0].t0-D.attn)); }
  const o=D.outro; if(o && t>o.a0) return sm3((t-o.a0)/Math.max(1,o.a1-o.a0));
  return 0; }
function bowW(t){ const o=D.outro; if(!o || t<o.b0) return 0; if(t<o.b1) return sm3((t-o.b0)/(o.b1-o.b0)); if(t<o.b2) return 1; return 1-sm3((t-o.b2)/(o.b3-o.b2)); }
const AP={LEN_M:3*FOOT, HALF:.10, BACK_TOE:30, STRAIGHT:.995};   
const SEO={LEN_M:2*FOOT, HALF:.05, BACK_TOE:30};
const DWI={LEN_M:2.2*FOOT, BACKW:.40, HALF:.03, BACK_TOE:90, SINK:.10};   
const PUNCH={H_MID:.78, H_FACE:1.32, REACH:1};          

const BLOCK={
  DOWN:{FWD:.26, DOWN:.10, OUT:.05},                    
  IN:{FWD:.41, H:.95, OUT:.03},                         
  FACE:{UP_Y:.90, UP_OUT:.34, UP_FWD:1.2, FO_IN:.70, FO_Y:.75, FO_FWD:.55} };   
const SUPPORT_EDGE=120;                                 
let KREF={};
const KICK_LEAN_KEEP=.12;                                  
const READY={HALF:DIM.shHalf*.95};                      
const READY_HAND={UP:TORSO_Y0+.02, FWD:.20, GAP:.10};    
const UPRIGHT=1;                                        
const CHAMBER={UP:TORSO_Y0+.035, OUT:.045, BACK:.03};
const KEYDIR=['F','L','L','R','R','F','F','R','R','L','L','F','F','L','L','R','R','B','B','F'];   
const DIRV={F:new THREE.Vector3(0,0,1),B:new THREE.Vector3(0,0,-1),L:new THREE.Vector3(1,0,0),R:new THREE.Vector3(-1,0,0)};
const YV=new THREE.Vector3(0,1,0);
const MINFO=D.moves.map((m,j)=>({ dir:m.dir||KEYDIR[m.n]||'F', ap: m.name.includes('왼앞굽이')?'L': m.name.includes('오른앞굽이')?'R':null,
  dwi: m.name.includes('왼뒷굽이')?'L': m.name.includes('오른뒷굽이')?'R':null,   
  seo: m.name.includes('왼앞서기')?'L': m.name.includes('오른앞서기')?'R':null,
  punch: m.name.includes('지르기'), face: /얼굴[가-힣]*지르기/.test(m.name),   
  block: m.name.includes('아래막기')?'down': m.name.includes('손날바깥막기')?'kout': m.name.includes('손날목치기')?'kneck': m.name.includes('안막기')?'in': m.name.includes('얼굴막기')?'face':null,
  arm: m.hand.startsWith('왼')?'L': m.hand.startsWith('오른')?'R':null,
  kick: m.name.startsWith('오른발 앞차기')?'R': m.name.startsWith('왼발 앞차기')?'L':null, ready: m.n===0||j===D.moves.length-1 }));
MINFO.forEach(mi=>{ mi.front= mi.ap||mi.seo||(mi.dwi?(mi.dwi==='L'?'R':'L'):null); });   
const NLAST=D.moves[D.moves.length-1].n, NCNT=NLAST-1;   
function corrW(f){ const t=D.t[f]; let best=0, idx=-1;
  D.moves.forEach((m,j)=>{ if(m.t0==null) return; let w=0;
    if(t>=m.t0&&t<=m.t1) w=1; else if(t<m.t0&&t>m.t0-CORR_IN) w=smooth3(1-(m.t0-t)/CORR_IN); else if(t>m.t1&&t<m.t1+CORR_OUT) w=smooth3(1-(t-m.t1)/CORR_OUT);
    if(w>best){best=w;idx=j;} }); return {w:best,j:idx}; }

function ik2(A,T,l1,l2,pole){
  const d=T.clone().sub(A); let L=d.length(); const dir=d.normalize(); L=Math.min(L,l1+l2-1e-4); L=Math.max(L,Math.abs(l1-l2)+1e-4);
  const a=(l1*l1-l2*l2+L*L)/(2*L), h=Math.sqrt(Math.max(0,l1*l1-a*a));
  let pn=pole.clone().addScaledVector(dir,-pole.dot(dir)); if(pn.lengthSq()<1e-8) pn=YV.clone().addScaledVector(dir,-dir.y); pn.normalize();
  return {mid:A.clone().addScaledVector(dir,a).addScaledVector(pn,h), end:A.clone().addScaledVector(dir,L)}; }
const poleOf=(A,M,E)=>{ const ax=E.clone().sub(A).normalize(); return M.clone().sub(A).addScaledVector(ax,-M.clone().sub(A).dot(ax)).normalize(); };

const AP_SOL=(()=>{ const th=DIM.th, sh=DIM.sh, Lleg=th+sh, lat=Math.max(0,AP.HALF-DIM.hipHalf);

  down: {main:sd=>[-sd*.10, DIM.torso*.92, .12], mainPole:sd=>[sd*.6,-1,0],

function yawOf(J){ const v=J.pel.z.clone().add(J.che.z); return Math.atan2(v.x,v.z); }

  const V=a=>new THREE.Vector3(a[0],a[1],a[2]);

    const tech= mi.punch?'punch': mi.block; if(!tech) continue;
    let fa=0; while(fa<NF-1&&D.t[fa+1]<=pv.t1) fa++; let fb=fa; while(fb<NF-1&&D.t[fb]<nm.t0) fb++;
    if(fb-fa<3) continue;
    const Ja=FR[fa], Jb=FR[fb], ya=yawOf(Ja), yb=yawOf(Jb), toL=(v,y)=>v.clone().applyAxisAngle(YV,-y);

      const S0=toL(Ja['wr'+s].clone().sub(Ja.hip),ya), B=toL(Jb['wr'+s].clone().sub(Jb.hip),yb);
      const p0=toL(poleOf(Ja['sh'+s],Ja['el'+s],Ja['wr'+s]),ya), pB=toL(poleOf(Jb['sh'+s],Jb['el'+s],Jb['wr'+s]),yb); Ap.normalize();

const lerpV=(a,b,u)=>a.clone().lerp(b,u);
function interp(t){ 
  let i=bs(t); const j=Math.min(NF-1,i+1); const u=j===i?0:Math.min(1,Math.max(0,(t-D.t[i])/(D.t[j]-D.t[i])));
  const FR=S.FR, A=FR[i],B=FR[j],O={};
  for(const k in A){ const a=A[k]; if(a instanceof THREE.Vector3) O[k]=lerpV(a,B[k],u);
    else if(typeof a==='number') O[k]=a+(B[k]-a)*u;
    else { O[k]={}; for(const q in a) O[k][q]=lerpV(a[q],B[k][q],u).normalize(); } }
  const floorF=S.floorF, RT=S.root; O.fl=floorF[i]+(floorF[j]-floorF[i])*u;
  O.root=[RT[i][0]+(RT[j][0]-RT[i][0])*u, RT[i][1]+(RT[j][1]-RT[i][1])*u];
  O.spd=S.spd[j]; return O;
}
function bs(t){ let lo=0,hi=NF-1; while(lo<hi){const m=(lo+hi+1)>>1; if(D.t[m]<=t) lo=m; else hi=m-1;} return lo; }

function moveAt(t){ 
  for(let i=0;i<MV.length;i++){ if(MV[i].t1!=null && t<=MV[i].t1) return MV[i]; } return MV[MV.length-1]; }
function activeOf(m){ const a={aL:0,aR:0,lL:0,lR:0};
  if(!m||!m.hand) return a; if(m.hand.startsWith('왼')) a.aL=1; else if(m.hand.startsWith('오른')) a.aR=1;
  if(m.name.startsWith('오른발 앞차기')) a.lR=1; if(m.name.startsWith('왼발 앞차기')) a.lL=1; return a; }
const el=id=>document.getElementById(id);

function setMoveName(name){ const nm=el('mvName'), esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const parts=name.split(/\s*→\s*/);
  nm.innerHTML= parts.length>1 ? parts.map(p=>'<span>'+esc(p)+'</span>').join('<span class="arr">↓</span>') : esc(name);
  fitMoveName(); fitCall(); }
function fitMoveName(){ const nm=el('mvName'); nm.style.fontSize=''; const maxW=innerWidth*.46-40; let fs=parseFloat(getComputedStyle(nm).fontSize);
  while(nm.scrollWidth>maxW && fs>13){ fs-=1; nm.style.fontSize=fs+'px'; } }

function fitCall(){ const c=el('call'); c.style.fontSize=''; let fs=parseFloat(getComputedStyle(c).fontSize);
  const room=Math.min(innerWidth*.5, innerWidth-el('mv').getBoundingClientRect().right-48-16);   
  while(c.scrollWidth>room && fs>24){ fs-=2; c.style.fontSize=fs+'px'; } }
addEventListener('resize',()=>{ fitMoveName(); fitCall(); });
let lastN=-1, lastCall='';

function callAt(t,m){
  const first=MV[0], last=MV[MV.length-1];
  if(D.attn && t<first.t0-350) return '차렷';
  if(m===first) return t>=first.t1-900 ? '시작' : '준비';
  if(m===last && t>=last.t1-450) return '쉬어';
  if(m===last) return '바로';
  return COUNT[m.n]+(m.n===NCNT?'! 기합!':(m.n>0?'!':''));
}
let soundOn=true, voiceKo=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voiceKo=vs.find(v=>/^ko/i.test(v.lang))||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
const RITUAL=['차렷','준비','시작','바로','쉬어'];
function say(txt){
  if(!soundOn || !window.speechSynthesis) return;
  if(rate>=1.5 && RITUAL.indexOf(txt)<0) return;   
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt.replace(/!/g,'').replace('기합','')); u.lang='ko-KR'; if(voiceKo) u.voice=voiceKo; u.rate=1.05; u.volume=1; speechSynthesis.speak(u); }catch(e){}
}
function ui(t){
  const m=moveAt(t);
  const ct=callAt(t,m);
  if(ct!==lastCall){ lastCall=ct; const c=el('call'); c.textContent=ct; fitCall(); c.classList.add('pop'); setTimeout(()=>c.classList.remove('pop'),140); if(playing) say(ct); }
  if(m.n!==lastN){ lastN=m.n;
    el('mvN').textContent= m.n===0?'준비': m.n===NLAST?'바로':m.n+'번'; setMoveName(m.label||m.name);
    const done=Math.min(NCNT,Math.max(0,m.n===NLAST?NCNT:m.n-1)); el('pn').textContent=(m.n===NLAST?NCNT:Math.max(0,m.n))+' / '+NCNT; el('pb').style.width=(done/NCNT*100)+'%'; }
  
  const m18=MV.filter(x=>x.n===NCNT).pop(), m19=MV[MV.length-1];
  drawFace(t>=m18.t0-150&&t<=m18.t1+300?'kiai': (m19&&t>=m19.t0)?'smile':'serious');
  return m;
}
function glow(m,J,dt){
  const act=activeOf(m);
  for(const k of ['aL','aR','lL','lR']){
    const sp=Math.min(1,Math.max(0,(J.spd[k]-0.5)/1.6));     
    const target=Math.max(act[k]*0.75, sp*0.9*(act[k]?1:0.55));
    glowNow[k]+= (target-glowNow[k])*Math.min(1,dt*8);
    limbMat[k].emissiveIntensity=glowNow[k]*0.55; jointMat[k].emissiveIntensity=glowNow[k]*1.2;
  }
}

const cam1=new THREE.PerspectiveCamera(38,1,.05,50), cam2=new THREE.PerspectiveCamera(32,230/290,.05,50);
let view='back';
function aim(cam,which,tgt){
  const d= which==='front'? new THREE.Vector3(0,.3,3.6) : which==='side'? new THREE.Vector3(3.6,.3,0) : new THREE.Vector3(0,.5,-3.5);
  cam.position.copy(tgt).add(d); cam.lookAt(tgt.x,tgt.y,tgt.z); }
function resize(){ const w=innerWidth,h=innerHeight; R1.setSize(w,h,false); cam1.aspect=w/h; cam1.updateProjectionMatrix();
  const b=el('mirrorBox'); R2.setSize(b.clientWidth,b.clientHeight,false); cam2.aspect=b.clientWidth/b.clientHeight; cam2.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const FOOTVIEW={RANGE:1.3, FIT_H:1.15, LIFT:.03, PRINT_L:.95, PRINT_W:.38};   
const fcv=el('foot'), fctx2=fcv.getContext('2d'); let fC=null, footOn=true;
function sizeFoot(){ const r=fcv.getBoundingClientRect(), d=devicePixelRatio||1; fcv.width=Math.max(1,Math.round(r.width*d)); fcv.height=Math.max(1,Math.round(r.height*d)); }
addEventListener('resize',sizeFoot); sizeFoot();
function stanceText(m){ if(attnW(curT)>.5) return ['모아서기','두 발 붙임 · 차렷']; const j=MV.indexOf(m), mi=MINFO[j]||{}, fn=s=>s==='L'?'왼발':'오른발';
  if(mi.ready||!mi.dir) return ['나란히서기','두 발 나란히 · 발끝 앞 · 어깨너비'];
  if(mi.ap) return ['앞굽이',fn(mi.ap)+' 앞 · 앞뒤 발 3개 · 옆 주먹 하나 · 앞무릎 굽힘 · 뒷발 '+AP.BACK_TOE+'°'];
  if(mi.seo) return ['앞서기',fn(mi.seo)+' 앞 · 앞뒤 발 2개 · 두 다리 폄 · 뒷발 '+SEO.BACK_TOE+'°'];
  return ['',''];
}
let lastStance='';
function drawFootPanel(m,dt){
  const c=fctx2, W=fcv.width, H=fcv.height, d=devicePixelRatio||1; c.clearRect(0,0,W,H);
  const feet=['L','R'].map(s=>{ const f=P['fe'+s]; const p=f.getWorldPosition(new THREE.Vector3()); const v=new THREE.Vector3(0,0,1).applyQuaternion(f.quaternion); v.y=0; v.normalize();
    return {s,p,v,len:f.scale.z,w:f.scale.x}; });
  const low=Math.min(feet[0].p.y,feet[1].p.y);
  const mid=new THREE.Vector2((feet[0].p.x+feet[1].p.x)/2,(feet[0].p.z+feet[1].p.z)/2);
  if(!fC) fC=mid.clone(); else fC.lerp(mid,Math.min(1,dt*4));
  
  const sc=Math.min(W/FOOTVIEW.RANGE, H/FOOTVIEW.FIT_H), X=x=>W/2-(x-fC.x)*sc, Y=z=>H/2-(z-fC.y)*sc;
  
  c.strokeStyle='rgba(127,176,255,.13)'; c.lineWidth=1*d;
  const rx=W/sc/2+FOOT, rz=H/sc/2+FOOT;
  for(let gx=Math.floor((fC.x-rx)/FOOT)*FOOT; gx<=fC.x+rx; gx+=FOOT){ c.beginPath(); c.moveTo(X(gx),0); c.lineTo(X(gx),H); c.stroke(); }
  for(let gz=Math.floor((fC.y-rz)/FOOT)*FOOT; gz<=fC.y+rz; gz+=FOOT){ c.beginPath(); c.moveTo(0,Y(gz)); c.lineTo(W,Y(gz)); c.stroke(); }
  
  c.fillStyle='rgba(159,194,255,.75)'; c.font=`700 ${11*d}px 'Noto Sans KR',sans-serif`; c.textAlign='center'; c.textBaseline='top'; c.fillText('▲ 앞',W/2,4*d);
  
  for(const f of feet){ const lifted=f.p.y-low>FOOTVIEW.LIFT, sx=-f.v.x, sy=-f.v.z, L=FOOT*FOOTVIEW.PRINT_L*sc, w=FOOT*FOOTVIEW.PRINT_W*sc;
    c.save(); c.translate(X(f.p.x),Y(f.p.z)); c.rotate(Math.atan2(sx,-sy));
    c.beginPath(); c.roundRect(-w/2,-L/2,w,L,[w*.5,w*.5,w*.38,w*.38]);
    const fc= sideColorOn ? SIDE_COLOR[f.s] : '#E8EEF6';
    if(lifted){ c.setLineDash([4*d,3*d]); c.strokeStyle=fc; c.globalAlpha=.7; c.lineWidth=1.5*d; c.stroke(); c.globalAlpha=1; }
    else { c.fillStyle=fc; c.fill(); c.fillStyle='rgba(8,17,31,.55)'; c.beginPath(); c.arc(0,-L*.3,w*.16,0,Math.PI*2); c.fill(); }  
    c.restore();
    c.fillStyle= lifted?'rgba(232,238,246,.7)':'#0B1220'; c.font=`900 ${Math.max(7*d,Math.min(12*d,w*.62))}px 'Noto Sans KR',sans-serif`; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(f.s==='L'?'왼':'오', X(f.p.x), Y(f.p.z)); }
  const st=stanceText(m), key=st.join('|'); if(key!==lastStance){ lastStance=key; el('fiName').textContent=st[0]; el('fiSpec').textContent=st[1]; }
}

let stopAt=null, curT=0, scrubDir=0;   
const SCRUB_RATE=.4;                       
let t=0, playing=true, rate=1, last=performance.now(), mirrorOn=true;
const EMBED=document.documentElement.classList.contains('embed'); if(EMBED) playing=false;   
const tgt=new THREE.Vector3(0,.95,0);
function tick(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  const er= rate>1 && (t<MV[0].t1 || t>=MV[MV.length-1].t0) ? 1 : rate;   
  if(playing && stopAt!=null && t+dt*1000*er>=stopAt){ t=stopAt; stopAt=null; playing=false; }   
  if(!playing && scrubDir){ t=Math.min(D.dur,Math.max(0,t+dt*1000*SCRUB_RATE*scrubDir)); }
  if(playing){ t+=dt*1000*er; if(t>D.dur+1500){
    if(EMBED){ playing=false; t=D.dur; document.documentElement.classList.add('idle'); try{ parent.__psmGroupDone && parent.__psmGroupDone(); }catch(e){} }   
    else t=0; } }
  const tt=Math.min(t,D.dur); curT=tt;
  const J=pose(tt); const m=ui(tt); glow(m,J,dt);
  const want=new THREE.Vector3(robot.position.x, .95, robot.position.z); tgt.lerp(want,Math.min(1,dt*2));
  if(view==='free'){ cam1.position.add(tgt.clone().sub(orbit.target)); orbit.target.copy(tgt); orbit.update(); }   
  else aim(cam1,view,tgt);
  R1.render(scene,cam1);
  if(mirrorOn){ aim(cam2,'front',tgt); R2.render(scene,cam2); }
  if(footOn) drawFootPanel(m,dt);
  if(!seeking) el('seek').value=Math.round(tt/D.dur*1000);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

let seeking=false;
el('play').onclick=()=>{ playing=!playing; el('play').textContent=playing?'⏸ 멈춤':'▶ 재생'; };
el('seek').oninput=e=>{ seeking=true; t=e.target.value/1000*D.dur; };
el('seek').onchange=()=>{ seeking=false; };
el('speed').onchange=e=>rate=+e.target.value;
el('view').onchange=e=>{ view=e.target.value; if(view==='free') orbit.target.copy(tgt); };

const orbit=new OrbitControls(cam1,cvs); orbit.enableDamping=true; orbit.dampingFactor=.12; orbit.enablePan=false;
orbit.minDistance=1.2; orbit.maxDistance=8; orbit.maxPolarAngle=Math.PI*.49; orbit.target.copy(tgt);
orbit.addEventListener('start',()=>{ if(view!=='free'){ view='free'; el('view').value='free'; orbit.target.copy(tgt); } });
el('move').onclick=e=>{ useMove=!useMove; e.target.classList.toggle('on',useMove); e.target.textContent=useMove?'이동':'제자리'; };
el('sideBtn').onclick=e=>{ applySideColor(!sideColorOn); e.target.classList.toggle('on',sideColorOn); e.target.textContent=sideColorOn?'좌우 색 켜짐':'좌우 색 꺼짐'; };
el('footBtn').onclick=e=>{ footOn=!footOn; el('footBox').style.display=footOn?'':'none'; e.target.classList.toggle('on',footOn); e.target.textContent=footOn?'발 위치 켜짐':'발 위치 꺼짐'; if(footOn) sizeFoot(); };
el('mirrorBtn').onclick=e=>{ mirrorOn=!mirrorOn; el('mirrorBox').style.display=mirrorOn?'':'none'; e.target.classList.toggle('on',mirrorOn); e.target.textContent=mirrorOn?'거울 켜짐':'거울 꺼짐'; };
let stabOn=true, fixOn=true;
function pickSet(){ S= !stabOn?SET.raw : fixOn?SET.clean:SET.nofix; }
el('stab').onclick=e=>{ stabOn=!stabOn; pickSet(); e.target.classList.toggle('on',stabOn); e.target.textContent=stabOn?'흔들림 잡기 켬':'흔들림 잡기 끔'; };
el('fix').onclick=e=>{ fixOn=!fixOn; pickSet(); e.target.classList.toggle('on',fixOn); e.target.textContent=fixOn?'자세 보정 켬':'자세 보정 끔'; };
el('head').oninput=e=>headScale=+e.target.value;
el('hand').oninput=e=>handScale=+e.target.value;
el('belt').onchange=e=>beltMat.color.set(e.target.value);
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); el('play').click(); } });

function moveIndexAt(tt){ for(let i=0;i<MV.length;i++){ if(tt<=MV[i].t1) return i; } return MV.length-1; }
window.__robot={
  play(){ t=0; stopAt=null; lastCall=''; playing=true; document.documentElement.classList.remove('idle'); },
  stop(){ playing=false; stopAt=null; t=0; lastCall=''; try{ speechSynthesis.cancel(); }catch(e){} document.documentElement.classList.add('idle'); },
  
  pause(){ playing=false; stopAt=null; try{ speechSynthesis.cancel(); }catch(e){} },
  resume(){ stopAt=null; playing=true; document.documentElement.classList.remove('idle'); },
  paused(){ return !playing; },
  
  seek(ms){ playing=false; stopAt=null; scrubDir=0; t=Math.min(D.dur,Math.max(0,ms)); try{ speechSynthesis.cancel(); }catch(e){} document.documentElement.classList.remove('idle'); },
  scrub(d){ if(d){ playing=false; stopAt=null; try{ speechSynthesis.cancel(); }catch(e){} document.documentElement.classList.remove('idle'); } scrubDir=d||0; },
  info(){ return {t:curT, dur:D.dur, marks:MV.map(m=>m.t0)}; },
  
  step(d){
    let k=moveIndexAt(t); k=Math.max(1,Math.min(MV.length-1,k+d));
    const prev=MV[k-1]; t=Math.max(0,prev.t1-150); stopAt=MV[k].t0+250; lastCall=''; playing=true;
    document.documentElement.classList.remove('idle');
    return MV[k].n;
  },
  sound(b){ soundOn=!!b; if(!soundOn){ try{ speechSynthesis.cancel(); }catch(e){} } },
  rate(r){ rate=r; el('speed').value=String(r); },
  view(v){ if(v==='free'){ if(view!=='free'){ aim(cam1,view==='front'||view==='side'?view:'back',tgt); view='free'; orbit.target.copy(tgt); orbit.update(); } } else view=v; el('view').value=view; },   
  mirror(b){ if(mirrorOn!==b) el('mirrorBtn').click(); },
  foot(b){ if(footOn!==b) el('footBtn').click(); }
};
window.__sample={DIM,HEAD_BASE,NF,moves:MV,SET,t:D.t,CAM_TILT,noPath:()=>computeSet(smClean,true,true,false),P};
</script>
