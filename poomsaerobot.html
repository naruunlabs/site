<style>
:root{--bg:#08111F;--panel:#101E33;--line:#4A3F22;--txt:#E8EEF6;--dim:#E9D49A;--glow:#F5B829}   
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
#main{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none}
#prog{left:32px;top:26px}
#prog .k{font-size:13px;letter-spacing:3px;color:#E9D49A;font-weight:700}
#prog .t{font-size:36px;font-weight:900}
#prog .bar{display:flex;align-items:center;gap:10px;margin-top:4px}
#prog .bar i{display:block;width:220px;height:10px;border-radius:5px;background:#1C2C45;overflow:hidden}
#prog .bar b{display:block;height:10px;width:0;background:var(--glow);transition:width .2s}
#prog .bar span{font-size:20px;font-weight:700}
#mv{left:32px;bottom:92px;background:var(--panel);border-radius:16px;padding:14px 20px;max-width:46vw}
#mv .n{font-size:15px;color:var(--dim);font-weight:700}
#mv .nm{font-size:26px;font-weight:900;white-space:nowrap}

#mv .nm span{display:block}
#mv .nm .arr{font-size:.7em;line-height:1.05;color:var(--dim)}
#call{right:48px;bottom:84px;font-size:min(96px,11vw);font-weight:900;letter-spacing:-2px;transition:transform .12s;white-space:nowrap}
#call.pop{transform:scale(1.15)}
#mirrorBox{position:fixed;right:28px;top:24px;width:230px;height:290px;border-radius:18px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
#mirrorBox .lb{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:15px;font-weight:700;color:var(--dim);z-index:2}
#mirror{width:100%;height:100%;display:block;transform:scaleX(-1)}

#footBox{position:fixed;right:270px;top:24px;width:210px;height:200px;border-radius:18px;background:var(--panel);border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
#footBox .lb{text-align:center;font-size:15px;font-weight:700;color:var(--dim);padding-top:8px}
#foot{flex:1;width:100%;min-height:0;display:block}
#footInfo{padding:6px 12px 10px;display:flex;flex-direction:column;gap:2px;text-align:center}
#fiName{font-size:17px;font-weight:900}
#fiSpec{font-size:12px;color:var(--dim);line-height:1.35}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:rgba(8,17,31,.85);border-top:1px solid var(--line);font-size:14px}
#ctl button,#ctl select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
#ctl button.on{border-color:var(--glow);color:#fff}
#ctl label{display:flex;align-items:center;gap:6px;color:var(--dim)}
#seek{flex:1 1 220px;accent-color:var(--glow)}
#ctl input[type=range]{accent-color:var(--glow)}

@media (max-width:1100px){#footBox{right:28px;top:324px;width:230px;height:190px}}
@media (max-width:700px){#footBox{right:12px;top:200px;width:140px;height:128px;border-radius:14px}#footBox .lb{display:none}#fiSpec{display:none}#fiName{font-size:13px}#footInfo{padding:2px 6px 6px}
  #mirrorBox{width:140px;height:180px;right:12px;top:12px}#prog .t{font-size:26px}#mv .nm{font-size:18px}#mv{bottom:140px}#call{bottom:140px}}

html.embed #ctl{display:none}
html.embed #prog{left:50%;transform:translateX(-50%);top:16px;text-align:center}
html.embed #prog .bar{justify-content:center}
html.embed #prog .k{display:none}
html.embed #mv{bottom:200px}   
html.embed #call{bottom:96px}
html.embed.idle #mv, html.embed.idle #call{visibility:hidden}

html.embed #mirrorBox{display:none!important}
html.embed #footBox{right:28px;top:24px}
@media (max-width:700px){html.embed #footBox{right:12px;top:12px}}

html.embed #mv{left:auto;right:28px;top:330px;bottom:auto;width:clamp(180px,23vw,260px);max-width:26vw}
html.embed #mv .nm{font-size:clamp(16px,1.9vw,26px)}
html.embed #call{top:240px;bottom:auto;right:28px;font-size:clamp(28px,4vw,60px)}
@media(max-width:700px){html.embed #mv{left:auto;right:12px;top:240px;bottom:auto;width:160px;max-width:30vw;padding:8px}html.embed #call{top:180px;right:12px;font-size:28px}}
</style>
<style>
#gate{position:fixed;inset:0;z-index:50;background:#08111F;display:flex;align-items:center;justify-content:center;padding:16px}
#gate[hidden]{display:none}
#gate .gb{width:min(380px,100%);background:#101E33;border:1px solid #2A3E5C;border-radius:16px;padding:26px 22px;text-align:center}
#gate .gate-logo{display:block;width:100%;max-width:320px;height:auto;margin:0 auto 22px}
#gate .gs{font-size:13px;color:#E9D49A;margin:0 0 16px;line-height:1.6}
#gate input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid #2A3E5C;background:#08111F;color:#E8EEF6;text-align:center;letter-spacing:.04em}
#gate button{width:100%;margin-top:10px;font:inherit;font-weight:900;font-size:16px;padding:12px;border-radius:10px;border:0;background:#F5B829;color:#2A1C00;cursor:pointer}
#gate .ge{min-height:1.4em;margin-top:10px;font-size:13px;color:#FF8A9A}
#pick{font:inherit}
</style>

function sizeFoot(){ const r=fcv.getBoundingClientRect(), d=devicePixelRatio||1; fcv.width=Math.max(1,Math.round(r.width*d)); fcv.height=Math.max(1,Math.round(r.height*d)); }
addEventListener('resize',sizeFoot); sizeFoot();
function stanceText(m){ if(attnW(curT)>.5) return ['모아서기','두 발 붙임 · 차렷']; const j=MV.indexOf(m), mi=MINFO[j]||{}, fn=s=>s==='L'?'왼발':'오른발';
  if(mi.ready||!mi.dir) return ['나란히서기','두 발 나란히 · 발끝 앞 · 어깨너비'];
  if(mi.side) return [mi.side==='L'?'왼서기':'오른서기','앞발을 당김 · 두 발 간격 유지'];
  if(mi.cross) return ['뒤꼬아서기','오른발 45° · 왼발 뒤에서 꼬아 딛기'];
  if(mi.ap) return ['앞굽이',fn(mi.ap)+' 앞 · 앞뒤 발 3개 · 옆 주먹 하나 · 앞무릎 굽힘 · 뒷발 '+AP.BACK_TOE+'°'];
  if(mi.seo) return ['앞서기',fn(mi.seo)+' 앞 · 앞뒤 발 2개 · 두 다리 폄 · 뒷발 '+SEO.BACK_TOE+'°'];
  return ['',''];
}
let lastStance='';
function drawFootPanel(m,dt){
  const c=fctx2, W=fcv.width, H=fcv.height, d=devicePixelRatio||1; c.clearRect(0,0,W,H);
  const feet=['L','R'].map(s=>{ const f=P['fe'+s]; const p=f.getWorldPosition(new THREE.Vector3()); const v=new THREE.Vector3(0,0,1).applyQuaternion(f.quaternion); v.y=0; v.normalize();
    return {s,p,v,len:f.scale.z,w:f.scale.x}; });
  const low=Math.min(feet[0].p.y,feet[1].p.y);
  const mid=new THREE.Vector2((feet[0].p.x+feet[1].p.x)/2,(feet[0].p.z+feet[1].p.z)/2);
  if(!fC) fC=mid.clone(); else fC.lerp(mid,Math.min(1,dt*4));
  
  const sc=Math.min(W/FOOTVIEW.RANGE, H/FOOTVIEW.FIT_H), X=x=>W/2-(x-fC.x)*sc, Y=z=>H/2-(z-fC.y)*sc;
  
  c.strokeStyle='rgba(127,176,255,.13)'; c.lineWidth=1*d;
  const rx=W/sc/2+FOOT, rz=H/sc/2+FOOT;
  for(let gx=Math.floor((fC.x-rx)/FOOT)*FOOT; gx<=fC.x+rx; gx+=FOOT){ c.beginPath(); c.moveTo(X(gx),0); c.lineTo(X(gx),H); c.stroke(); }
  for(let gz=Math.floor((fC.y-rz)/FOOT)*FOOT; gz<=fC.y+rz; gz+=FOOT){ c.beginPath(); c.moveTo(0,Y(gz)); c.lineTo(W,Y(gz)); c.stroke(); }
  
  c.fillStyle='rgba(159,194,255,.75)'; c.font=`700 ${11*d}px 'Noto Sans KR',sans-serif`; c.textAlign='center'; c.textBaseline='top'; c.fillText('▲ 앞',W/2,4*d);
  
  for(const f of feet){ const lifted=f.p.y-low>FOOTVIEW.LIFT, sx=-f.v.x, sy=-f.v.z, L=FOOT*FOOTVIEW.PRINT_L*sc, w=FOOT*FOOTVIEW.PRINT_W*sc;
    c.save(); c.translate(X(f.p.x),Y(f.p.z)); c.rotate(Math.atan2(sx,-sy));
    c.beginPath(); c.roundRect(-w/2,-L/2,w,L,[w*.5,w*.5,w*.38,w*.38]);
    const fc= sideColorOn ? SIDE_COLOR[f.s] : '#E8EEF6';
    if(lifted){ c.setLineDash([4*d,3*d]); c.strokeStyle=fc; c.globalAlpha=.7; c.lineWidth=1.5*d; c.stroke(); c.globalAlpha=1; }
    else { c.fillStyle=fc; c.fill(); c.fillStyle='rgba(8,17,31,.55)'; c.beginPath(); c.arc(0,-L*.3,w*.16,0,Math.PI*2); c.fill(); }  
    c.restore();
    c.fillStyle= lifted?'rgba(232,238,246,.7)':'#0B1220'; c.font=`900 ${Math.max(7*d,Math.min(12*d,w*.62))}px 'Noto Sans KR',sans-serif`; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(f.s==='L'?'왼':'오', X(f.p.x), Y(f.p.z)); }
  const st=stanceText(m), key=st.join('|'); if(key!==lastStance){ lastStance=key; el('fiName').textContent=st[0]; el('fiSpec').textContent=st[1]; }
}

let stopAt=null, curT=0, scrubDir=0;   
const SCRUB_RATE=.4;                       
let t=0, playing=true, rate=1, last=performance.now(), mirrorOn=true;
const EMBED=document.documentElement.classList.contains('embed'); if(EMBED){ playing=false; mirrorOn=false; }   
const tgt=new THREE.Vector3(0,.95,0);
function tick(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;

  const er= rate>1 && (t<MV[0].t1 || t>=MV[MV.length-2].t0) ? 1 : rate;
  if(playing && stopAt!=null && t+dt*1000*er>=stopAt){ t=stopAt; stopAt=null; playing=false; }   
  if(!playing && scrubDir){ t=Math.min(D.dur,Math.max(0,t+dt*1000*SCRUB_RATE*scrubDir)); }
  if(playing){ t+=dt*1000*er;
    if(LOOP && t>=LOOP.end){ t=LOOP.start; lastCall=callAt(LOOP.start); }   
    if(t>D.dur+1500){
    if(EMBED){ playing=false; t=D.dur; document.documentElement.classList.add('idle'); try{ parent.__psmGroupDone && parent.__psmGroupDone(); }catch(e){} }   
    else t=0; } }
  const tt=Math.min(t,D.dur); curT=tt;
  const J=pose(tt); const m=ui(tt); glow(m,J,dt); updateGroupGuides(tt);
  const want=new THREE.Vector3(robot.position.x, .95, robot.position.z); tgt.lerp(want,Math.min(1,dt*2));
  if(view==='free'){ cam1.position.add(tgt.clone().sub(orbit.target)); orbit.target.copy(tgt); orbit.update(); }   
  else aim(cam1,view,tgt);
  R1.render(scene,cam1);
  if(mirrorOn){ aim(cam2,'front',tgt); R2.render(scene,cam2); }
  if(footOn) drawFootPanel(m,dt);
  if(!seeking) el('seek').value=Math.round(tt/D.dur*1000);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function moveIndexAt(tt){ for(let i=0;i<MV.length;i++){ if(tt<=MV[i].t1) return i; } return MV.length-1; }
window.__robot={
  play(){ t=0; stopAt=null; lastCall=''; playing=true; document.documentElement.classList.remove('idle'); },
  stop(){ playing=false; stopAt=null; t=0; lastCall=''; try{ speechSynthesis.cancel(); }catch(e){} document.documentElement.classList.add('idle'); },
  
  pause(){ playing=false; stopAt=null; try{ speechSynthesis.cancel(); }catch(e){} },
  resume(){ stopAt=null; playing=true; document.documentElement.classList.remove('idle'); },
  paused(){ return !playing; },
  
  seek(ms){ playing=false; stopAt=null; scrubDir=0; t=Math.min(D.dur,Math.max(0,ms)); try{ speechSynthesis.cancel(); }catch(e){} document.documentElement.classList.remove('idle'); },
  scrub(d){ if(d){ playing=false; stopAt=null; try{ speechSynthesis.cancel(); }catch(e){} document.documentElement.classList.remove('idle'); } scrubDir=d||0; },
  info(){ return {t:curT, dur:D.dur, marks:MV.map(m=>m.t0), loop:LOOP}; },
  
  loop(a,b){ return setLoop(a,b); },
  playLoop(){ const L=LOOP; if(!L){ this.play(); return; } t=(L.a===1?0:L.start); stopAt=null; lastCall=(L.a===1?'':callAt(L.start)); playing=true; document.documentElement.classList.remove('idle'); },
  
  step(d){
    let k=moveIndexAt(t); k=Math.max(1,Math.min(MV.length-1,k+d));
    const prev=MV[k-1]; t=Math.max(0,prev.t1-150); stopAt=MV[k].t0+250; lastCall=''; playing=true;
    document.documentElement.classList.remove('idle');
    return MV[k].n;
  },
  sound(b){ soundOn=!!b; if(!soundOn){ try{ speechSynthesis.cancel(); }catch(e){} } },
  rate(r){ rate=r; el('speed').value=String(r); },
  view(v){ if(v==='free'){ if(view!=='free'){ aim(cam1,view==='front'||view==='side'?view:'back',tgt); view='free'; orbit.target.copy(tgt); orbit.update(); } } else view=v; el('view').value=view; },   
  mirror(b){ if(EMBED) return; if(mirrorOn!==b) el('mirrorBtn').click(); },   
  foot(b){ if(footOn!==b) el('footBtn').click(); }
};

let guidanceOn=true,activeGuide=-1,kiaiChoice=0,previousGuideTime=0;
let arrowShaft=null,arrowHead=null,arrowCurve=null;
function footWorldAt(ms,s){const j=interp(ms);return j['an'+s].clone().add(new THREE.Vector3(j.root[0],-j.fl+ANKLE_H,j.root[1]));}
const guideTurns=[];
for(let j=1;j<MV.length;j++){
 const a=interp(MV[j-1].t1-30).pel.z,b=interp(MV[j].t0+100).pel.z;
 if(Math.acos(THREE.MathUtils.clamp(a.dot(b),-1,1))>.55 && stepFoot(j))guideTurns.push(j);
}
function loadGuideTurn(j){
 const demoBegin=MV[j-1].t1;
 activeGuide=j;const moving=stepFoot(j),fixed=moving==='L'?'R':'L';
 const movingColor=guideFootColor[moving];
 gold.color.setHex(movingColor);landingMat.color.setHex(movingColor);softGold.color.setHex(movingColor);

 const A=footWorldAt(demoBegin,moving),B=footWorldAt(MV[j].t0+100,moving),pivot=footWorldAt(demoBegin,fixed);
 
 const gather=(MINFO[j-1].ap && MINFO[j].seo && moving!==MINFO[j-1].front) || (D.title==='태극 3장' && MV[j].n===7);
 const pts=[],av=new THREE.Vector2(A.x,A.z),bv=new THREE.Vector2(B.x,B.z),pv=new THREE.Vector2(pivot.x,pivot.z);
 for(let k=0;k<=64;k++){
  const u=k/64,route=previewFootRoute(av,bv,pv,u,j,gather);
  const point=new THREE.Vector3(route.x,.12,route.y),chord=A.clone().lerp(B,u);chord.y=.12;
  pts.push(gather?point:chord.lerp(point,.42));
 }
 const fullCurve=new THREE.CatmullRomCurve3(pts),length=fullCurve.getLength();
 const gap=Math.min(.18,length*.22),trimmed=[];
 for(let k=0;k<=64;k++)trimmed.push(fullCurve.getPointAt(gap/length+(1-2*gap/length)*k/64));
 arrowCurve=new THREE.CatmullRomCurve3(trimmed);
 if(arrowShaft){demoRoot.remove(arrowShaft);arrowShaft.geometry.dispose();demoRoot.remove(arrowHead);arrowHead.geometry.dispose();}
 
 const total=arrowCurve.getLength(),headLength=Math.min(.17,total*.26),shaftEnd=Math.max(.1,1-headLength/total),verts=[],indices=[];
 for(let k=0;k<=64;k++){
  const u=shaftEnd*k/64,point=arrowCurve.getPointAt(u),tangent=arrowCurve.getTangentAt(u);
  const normal=new THREE.Vector3(tangent.z,0,-tangent.x).normalize().multiplyScalar(.031);
  const left=point.clone().add(normal),right=point.clone().sub(normal);verts.push(...left.toArray(),...right.toArray());
  if(k<64){const n=k*2;indices.push(n,n+1,n+2,n+1,n+3,n+2);}
 }
 const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geometry.setIndex(indices);geometry.computeVertexNormals();
 arrowShaft=new THREE.Mesh(geometry,gold);demoRoot.add(arrowShaft);
 const tip=arrowCurve.getPointAt(1),base=arrowCurve.getPointAt(shaftEnd),direction=tip.clone().sub(base).normalize();
 const side=new THREE.Vector3(direction.z,0,-direction.x).multiplyScalar(.095);
 const headGeometry=new THREE.BufferGeometry();headGeometry.setAttribute('position',new THREE.Float32BufferAttribute([...tip.toArray(),...base.clone().add(side).toArray(),...base.clone().sub(side).toArray()],3));headGeometry.computeVertexNormals();
 arrowHead=new THREE.Mesh(headGeometry,gold);demoRoot.add(arrowHead);
 destination.position.set(B.x,.025,B.z);sourceRing.position.set(A.x,.026,A.z);pivotRing.position.set(pivot.x,.027,pivot.z);
}

const localKiai=new Audio();localKiai.preload='auto';localKiai.src=GROUP_KIAI_AUDIO[0];
function stopGuideKiai(){localKiai.pause();localKiai.currentTime=0;try{if(parent!==window && parent.__psmStopKiai)parent.__psmStopKiai();}catch(e){}}
function playGuideKiai(){
 if(!soundOn)return;
 try{if(parent!==window && parent.__psmKiai){parent.__psmKiai(kiaiChoice);return;}}catch(e){}
 try{speechSynthesis.cancel();}catch(e){}
 localKiai.pause();localKiai.currentTime=0;localKiai.volume=.85;localKiai.play().catch(()=>{});
}
function updateGroupGuides(tt){
 const j=guideTurns.find(j=>tt>=MV[j-1].t1-900 && tt<=MV[j].t0+350);
 if(j!==undefined && activeGuide!==j)loadGuideTurn(j);
 demoRoot.visible=guidanceOn && j!==undefined;
 if(playing && soundOn && tt>=previousGuideTime && tt-previousGuideTime<350){
  for(const m of MV)if(/기합/.test(m.name) && previousGuideTime<m.t0 && tt>=m.t0)playGuideKiai();
 }
 previousGuideTime=tt;
}
Object.assign(window.__robot,{
 guidance(on){guidanceOn=!!on;demoRoot.visible=false;},
 kiai(index){kiaiChoice=Math.min(4,Math.max(0,Number(index)||0));localKiai.src=GROUP_KIAI_AUDIO[kiaiChoice];},
 audioSources(){return GROUP_KIAI_AUDIO.slice();},
 previewKiai(){playGuideKiai();}
});
for(const key of ['stop','pause','seek']){const original=window.__robot[key];window.__robot[key]=function(...args){stopGuideKiai();const value=original.apply(this,args);previousGuideTime=t;return value;};}
const originalSound=window.__robot.sound;window.__robot.sound=function(on){originalSound.call(this,on);if(!on)stopGuideKiai();};

window.__sample={DIM,HEAD_BASE,NF,moves:MV,SET,t:D.t,CAM_TILT,noPath:()=>computeSet(smClean,true,true,false),P};
